<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor usage</title>
    <style>
        :root {
            --bg: var(--vscode-sideBar-background, #f4f7f6);
            --panel: var(--vscode-editor-background, #fff);
            --ink: var(--vscode-foreground, #0f2744);
            --muted: var(--vscode-descriptionForeground, #5a6b7d);
            --border: var(--vscode-panel-border, #d8e3de);
            --head: var(--vscode-list-hoverBackground, #e8f5f0);
            --warn: #b45309;
            --hot: #dc2626;
            --ok: #0d9488;
            --warn-bg: rgba(180, 83, 9, 0.14);
            --hot-bg: rgba(220, 38, 38, 0.14);
            --mid-bg: rgba(13, 148, 136, 0.1);
            --latest-bg: rgba(13, 148, 136, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--vscode-font-family, ui-sans-serif, system-ui, sans-serif);
            font-size: var(--vscode-font-size, 13px);
            background: var(--bg);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: .35rem .5rem;
            align-items: center;
            padding: .4rem .5rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--panel);
        }

        .toolbar label {
            font-size: .88em;
            color: var(--muted);
        }

        .toolbar .meta {
            margin-left: auto;
            color: var(--muted);
            font-size: .78em;
            max-width: 46%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        button {
            border: 1px solid var(--border);
            background: var(--panel);
            padding: .28rem .55rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: .88em;
            color: var(--ink);
        }

        button:hover {
            background: var(--head);
        }

        button.active {
            border-color: var(--ok);
            color: var(--ok);
        }

        .columns-wrap {
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            padding: .45rem .5rem .5rem;
            display: none;
        }

        .columns-wrap.open {
            display: block;
        }

        .columns-head {
            display: flex;
            align-items: center;
            gap: .4rem;
            margin-bottom: .35rem;
        }

        .columns-title {
            font-size: .72rem;
            font-weight: 650;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
        }

        .columns-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
            gap: .25rem .6rem;
            max-height: 7.75rem;
            overflow: auto;
            padding-right: .2rem;
        }

        .col-opt {
            display: flex;
            align-items: center;
            gap: .35rem;
            font-size: .84em;
            color: var(--ink);
            white-space: nowrap;
        }

        .sections {
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            padding: .45rem .5rem .5rem;
        }

        .section-block {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: .4rem .5rem;
            background: color-mix(in srgb, var(--panel) 94%, var(--head));
        }

        .section-block h2 {
            margin: 0 0 .35rem;
            font-size: .74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
        }

        .summary-grid {
            display: flex;
            flex-wrap: wrap;
            gap: .35rem;
            align-items: stretch;
        }

        .metric {
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: .28rem .45rem;
            background: var(--panel);
            min-width: 0;
            flex: 1 1 5.5rem;
        }

        .metric .k {
            font-size: .66rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
            line-height: 1.2;
            margin-bottom: .15rem;
        }

        .metric .v {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 1.07rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .num-mid {
            color: var(--ok);
        }

        .num-warn {
            color: var(--warn);
        }

        .num-high {
            color: var(--hot);
        }

        .cf-bg-mid {
            background: var(--mid-bg);
            border-radius: 3px;
            padding: 0 .15rem;
        }

        .cf-bg-warn {
            background: var(--warn-bg);
            border-radius: 3px;
            padding: 0 .15rem;
        }

        .cf-bg-hot {
            background: var(--hot-bg);
            border-radius: 3px;
            padding: 0 .15rem;
        }

        .table-wrap {
            flex: 1;
            overflow: auto;
            min-height: 0;
        }

        table {
            width: max-content;
            min-width: 100%;
            border-collapse: collapse;
            font-size: .9em;
        }

        th,
        td {
            padding: .34rem .42rem;
            text-align: right;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            max-width: 20rem;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th.col-left,
        td.col-left {
            text-align: left;
        }

        th {
            background: var(--head);
            position: sticky;
            top: 0;
            font-weight: 650;
            z-index: 1;
        }

        tr.row-latest td {
            background: var(--latest-bg);
        }

        tr.row-latest td:first-child {
            box-shadow: inset 3px 0 0 var(--ok);
        }

        tr.row-latest td .cell-inner {
            font-weight: 650;
        }

        td.has-bar {
            position: relative;
            padding: 0;
        }

        td.has-bar .cell-inner {
            position: relative;
            z-index: 1;
            display: block;
            padding: .34rem .42rem;
            text-align: inherit;
        }

        td.has-bar .data-bar {
            position: absolute;
            left: 0;
            top: 15%;
            bottom: 15%;
            border-radius: 3px;
            z-index: 0;
            max-width: 100%;
        }

        td.has-bar .data-bar.bar-mid {
            background: rgba(13, 148, 136, 0.22);
        }

        td.has-bar .data-bar.bar-warn {
            background: rgba(180, 83, 9, 0.2);
        }

        td.has-bar .data-bar.bar-hot {
            background: rgba(220, 38, 38, 0.18);
        }

        td.cost-mismatch .cell-inner {
            text-decoration: underline dotted var(--warn);
        }

        tr.event-daily td {
            color: var(--muted);
            font-style: italic;
        }

        .empty-hint {
            padding: 1rem .75rem;
            text-align: center;
            color: var(--muted);
            line-height: 1.45;
        }

        .insights-wrap {
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            padding: 0 .5rem .55rem;
        }

        .insights-wrap.collapsed .insights-body {
            display: none;
        }

        .insights-head {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .45rem 0 .35rem;
        }

        .insights-head h2 {
            margin: 0;
            font-size: .74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
            flex: 1;
        }

        .insights-grid {
            display: flex;
            flex-direction: column;
            gap: .5rem;
        }

        .ts-chart {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 7.25rem;
            padding: .3rem 0 .1rem;
            overflow-x: auto;
        }

        .ts-col {
            flex: 1 1 0;
            min-width: 1.4rem;
            max-width: 2.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
        }

        .ts-bar {
            width: 100%;
            max-width: 1.35rem;
            background: color-mix(in srgb, var(--ok) 50%, transparent);
            border-radius: 3px 3px 0 0;
            min-height: 3px;
        }

        .ts-lbl {
            font-size: .6rem;
            color: var(--muted);
            margin-top: .22rem;
            line-height: 1;
        }

        .insight-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: .45rem .5rem .5rem;
            background: color-mix(in srgb, var(--panel) 96%, var(--head));
            min-width: 0;
        }

        .insight-card h3 {
            margin: 0 0 .35rem;
            font-size: .72rem;
            font-weight: 650;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
        }

        .cmp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .84em;
        }

        .cmp-table th,
        .cmp-table td {
            padding: .22rem .3rem;
            text-align: right;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .cmp-table th:first-child,
        .cmp-table td:first-child {
            text-align: left;
            max-width: 9rem;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cmp-table th {
            font-weight: 600;
            color: var(--muted);
            font-size: .78em;
        }

        .bar-chart {
            margin-top: .35rem;
            display: flex;
            flex-direction: column;
            gap: .28rem;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 4.5rem 1fr 2.5rem;
            gap: .35rem;
            align-items: center;
            font-size: .78em;
        }

        .bar-row .lbl {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
        }

        .bar-track {
            height: .55rem;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .bar-fill {
            height: 100%;
            background: color-mix(in srgb, var(--ok) 55%, transparent);
            border-radius: 3px;
        }

        .insight-foot {
            margin-top: .35rem;
            font-size: .72em;
            color: var(--muted);
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <button type="button" id="reloadBtn">Refresh</button>
        <button type="button" id="popOutBtn">Pop out</button>
        <label><input type="checkbox" id="turnsOnly" checked /> Turns only</label>
        <button type="button" id="insightsBtn">Charts</button>
        <button type="button" id="columnsBtn">Columns</button>
        <button type="button" id="colsCoreBtn">Core</button>
        <button type="button" id="colsAllBtn">All</button>
        <span class="meta" id="meta"></span>
    </div>
    <div class="columns-wrap" id="columnsWrap">
        <div class="columns-head">
            <span class="columns-title">Displayed columns</span>
        </div>
        <div class="columns-list" id="columnsList"></div>
    </div>
    <div class="sections" id="sections">
        <div class="section-block">
            <h2>Today (UTC cumulative)</h2>
            <div class="summary-grid" id="daySummary"></div>
        </div>
    </div>
    <div class="insights-wrap" id="insightsWrap">
        <div class="insights-head">
            <h2>Recent prompts &amp; cost by model</h2>
            <button type="button" id="insightsToggleBtn">Hide</button>
        </div>
        <div class="insights-body" id="insightsBody"></div>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr id="tableHead"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="empty-hint" id="emptyHint" style="display:none"></div>
    <script>
        const vscode = acquireVsCodeApi();
        const uiState = vscode.getState() || {};
        let boot = {
            rows: [],
            lastTurn: null,
            dayTotals: null,
            dailySnapshot: null,
            state: {},
            csvPath: "",
            generatedAt: "",
            hooksInstalled: true,
            cloudSync: null,
        };

        const BILLABLE_EVENTS = new Set(["agentTurn", "cloudRun"]);
        function isBillableEvent(ev) {
            return BILLABLE_EVENTS.has(String(ev || ""));
        }

        const ALL_COLUMNS = [
            { key: "at", label: "Time", align: "left" },
            { key: "event", label: "Event", align: "left" },
            { key: "model", label: "Model", align: "left" },
            { key: "conversation", label: "Conversation", align: "left" },
            { key: "generation_id", label: "Generation", align: "left" },
            { key: "input_uncached_tokens", label: "Input tok" },
            { key: "cache_read_tokens", label: "Cache read" },
            { key: "cache_write_tokens", label: "Cache write" },
            { key: "output_tokens", label: "Out tok" },
            { key: "total_tokens", label: "Total tok" },
            { key: "cumulative_total_tokens", label: "Cum tok" },
            { key: "cumulative_output_tokens", label: "Cum out" },
            { key: "context_usage_percent", label: "Ctx %" },
            { key: "cost_usd", label: "Cost ¢" },
            { key: "cumulative_cost_usd", label: "Cum $" },
        ];
        const CORE_COLUMN_KEYS = [
            "at",
            "conversation",
            "model",
            "total_tokens",
            "cost_usd",
            "cumulative_cost_usd",
        ];

        const BAR_COLUMN_KEYS = new Set([
            "cost_usd",
            "cumulative_cost_usd",
            "total_tokens",
            "context_usage_percent",
        ]);

        let visibleColumnKeys = normalizeColumns(uiState.visibleColumnKeys);
        let columnsOpen = Boolean(uiState.columnsOpen);
        let insightsOpen = uiState.insightsOpen !== false;
        document.getElementById("turnsOnly").checked = uiState.turnsOnly !== false;

        const fmtInt = (n) => (n == null || n === "") ? "—" : Number(n).toLocaleString();
        const fmtTok = (n) => {
            const v = Number(n);
            if (!Number.isFinite(v) || v < 0) return "—";
            if (v >= 1_000_000) {
                const m = v / 1_000_000;
                if (m >= 10) return Math.round(m) + "M";
                return m.toFixed(1).replace(/\.0$/, "") + "M";
            }
            if (v >= 1000) return Math.round(v / 1000) + "K";
            return String(Math.round(v));
        };
        const TOKEN_COLUMN_KEYS = new Set([
            "input_uncached_tokens",
            "cache_read_tokens",
            "cache_write_tokens",
            "output_tokens",
            "total_tokens",
            "cumulative_total_tokens",
            "cumulative_output_tokens",
        ]);
        const fmtCents = (n) => {
            const v = Number(n);
            if (!Number.isFinite(v)) return "—";
            return String(Math.round(v * 100)) + "¢";
        };
        const fmtUsdRound = (n) => {
            const v = Number(n);
            if (!Number.isFinite(v)) return "—";
            return "$" + Math.round(v);
        };
        const fmtUsdShort = (n) => {
            const v = Number(n);
            if (!Number.isFinite(v)) return "—";
            if (v >= 100) return "$" + Math.round(v);
            return "$" + v.toFixed(2);
        };
        const fmtUsdPerM = (n) => {
            const v = Number(n);
            if (!Number.isFinite(v)) return "—";
            return "$" + v.toFixed(2) + "/M";
        };
        const fmtPct = (n) => (n == null || n === "") ? "—" : Number(n).toFixed(1) + "%";

        const shortAt = (s) => {
            if (!s) return "";
            const d = new Date(s);
            if (Number.isNaN(d.getTime())) return String(s).slice(5, 16);
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            const hh = String(d.getHours()).padStart(2, "0");
            const mi = String(d.getMinutes()).padStart(2, "0");
            return mm + "-" + dd + " " + hh + ":" + mi;
        };

        function normalizeColumns(keys) {
            if (!Array.isArray(keys)) {
                return CORE_COLUMN_KEYS.slice();
            }
            const wanted = new Set(keys.filter((k) => typeof k === "string"));
            if (wanted.has("conversation_id")) {
                wanted.delete("conversation_id");
                wanted.add("conversation");
            }
            const out = ALL_COLUMNS.map((c) => c.key).filter((k) => wanted.has(k));
            return out.length ? out : CORE_COLUMN_KEYS.slice();
        }

        function saveUiState() {
            vscode.setState({
                ...(vscode.getState() || {}),
                visibleColumnKeys,
                columnsOpen,
                insightsOpen,
                turnsOnly: document.getElementById("turnsOnly").checked,
            });
        }

        function tierUsdPerTurn(v) {
            const c = Number(v);
            if (!Number.isFinite(c) || c <= 0) return { text: [], bar: null };
            if (c >= 0.2) return { text: ["num-high"], bar: "bar-hot" };
            if (c >= 0.08) return { text: ["num-warn"], bar: "bar-warn" };
            if (c >= 0.03) return { text: ["num-mid"], bar: "bar-mid" };
            return { text: [], bar: "bar-mid" };
        }

        function tierUsdSession(v) {
            const c = Number(v);
            if (!Number.isFinite(c) || c <= 0) return { text: [], bar: null };
            if (c >= 10) return { text: ["num-high"], bar: "bar-hot" };
            if (c >= 3) return { text: ["num-warn"], bar: "bar-warn" };
            if (c >= 1) return { text: ["num-mid"], bar: "bar-mid" };
            return { text: [], bar: "bar-mid" };
        }

        function tierCtxPct(v) {
            const p = Number(v);
            if (!Number.isFinite(p) || p <= 0) return { text: [], bar: null };
            if (p >= 90) return { text: ["num-high"], bar: "bar-hot" };
            if (p >= 75) return { text: ["num-warn"], bar: "bar-warn" };
            if (p >= 50) return { text: ["num-mid"], bar: "bar-mid" };
            return { text: [], bar: "bar-mid" };
        }

        function tierTokenCount(v, warnAt, hotAt) {
            const t = Number(v);
            if (!Number.isFinite(t) || t <= 0) return { text: [], bar: null };
            if (t >= hotAt) return { text: ["num-high"], bar: "bar-hot" };
            if (t >= warnAt) return { text: ["num-warn"], bar: "bar-warn" };
            return { text: [], bar: "bar-mid" };
        }

        function tierForCell(key, r) {
            if (key === "cost_usd") return tierUsdPerTurn(r.cost_usd);
            if (key === "cumulative_cost_usd") return tierUsdSession(r.cumulative_cost_usd);
            if (key === "total_tokens") return tierTokenCount(r.total_tokens, 50000, 100000);
            if (key === "context_usage_percent") return tierCtxPct(r.context_usage_percent);
            return { text: [], bar: null };
        }

        function metricCard(label, value, classes) {
            const card = document.createElement("div");
            card.className = "metric";
            const k = document.createElement("div");
            k.className = "k";
            k.textContent = label;
            const v = document.createElement("div");
            v.className = "v";
            if (classes) v.className += " " + classes;
            v.textContent = value;
            card.appendChild(k);
            card.appendChild(v);
            return card;
        }

        function paintSummary(el, items) {
            el.replaceChildren();
            items.forEach(([label, value, classes]) => {
                el.appendChild(metricCard(label, value, classes || ""));
            });
        }

        function filteredRows() {
            let list = (boot.rows || []).slice();
            if (document.getElementById("turnsOnly").checked) {
                list = list.filter((r) => isBillableEvent(r.event));
            }
            return list.sort((a, b) => String(b.at).localeCompare(String(a.at)));
        }

        function cellNumericValue(key, r) {
            const v = r[key];
            if (key === "cost_usd" || key === "cumulative_cost_usd") {
                return Number(v || 0);
            }
            if (key === "total_tokens" || key === "context_usage_percent") {
                return Number(v || 0);
            }
            return 0;
        }

        function columnMaxima(list, cols) {
            const max = {};
            cols.forEach((col) => {
                if (!BAR_COLUMN_KEYS.has(col.key)) return;
                let m = 0;
                list.forEach((r) => {
                    const n = cellNumericValue(col.key, r);
                    if (n > m) m = n;
                });
                max[col.key] = m;
            });
            return max;
        }

        function formatCell(key, r) {
            const v = r[key];
            if (key === "at") return shortAt(v);
            if (key === "cost_usd") return fmtCents(v);
            if (key === "cumulative_cost_usd") return fmtUsdRound(v);
            if (key === "context_usage_percent") return fmtPct(v);
            if (
                key === "input_uncached_tokens" ||
                key === "cache_read_tokens" ||
                key === "cache_write_tokens" ||
                key === "output_tokens" ||
                key === "total_tokens" ||
                key === "cumulative_total_tokens" ||
                key === "cumulative_output_tokens"
            ) {
                return fmtTok(v);
            }
            if (key === "conversation") {
                const label = r.conversation != null ? String(r.conversation) : "";
                return label || "—";
            }
            if (v == null || v === "") return "—";
            return String(v);
        }

        function appendCell(td, col, r, maxima) {
            const text = formatCell(col.key, r);
            const tier = tierForCell(col.key, r);
            const useBar = BAR_COLUMN_KEYS.has(col.key);
            if (!useBar) {
                td.textContent = text;
                if (TOKEN_COLUMN_KEYS.has(col.key)) {
                    const raw = Number(r[col.key]);
                    if (Number.isFinite(raw)) td.title = fmtInt(raw);
                }
                if (col.key === "cost_usd" || col.key === "cumulative_cost_usd") {
                    const raw = Number(r[col.key]);
                    if (Number.isFinite(raw)) {
                        td.title = col.key === "cost_usd"
                            ? fmtCents(raw) + " (" + raw.toFixed(4) + " USD)"
                            : fmtUsdRound(raw) + " (" + raw.toFixed(4) + " USD)";
                    }
                }
                if (tier.text.length) td.className = tier.text.join(" ");
                return;
            }
            td.classList.add("has-bar");
            if (col.key === "cost_usd" && r.cost_mismatch) {
                td.classList.add("cost-mismatch");
            }
            const bar = document.createElement("div");
            bar.className = "data-bar";
            const raw = cellNumericValue(col.key, r);
            const max = maxima[col.key] || 0;
            const pct = max > 0 && raw > 0 ? Math.max(8, Math.round((raw / max) * 100)) : 0;
            bar.style.width = pct + "%";
            if (tier.bar) bar.classList.add(tier.bar);
            const inner = document.createElement("span");
            inner.className = "cell-inner";
            if (tier.text.length) inner.className += " " + tier.text.join(" ");
            inner.textContent = text;
            if (TOKEN_COLUMN_KEYS.has(col.key)) {
                const rawTok = Number(r[col.key]);
                if (Number.isFinite(rawTok)) td.title = fmtInt(rawTok);
            }
            if (col.key === "cost_usd" || col.key === "cumulative_cost_usd") {
                const rawCost = Number(r[col.key]);
                if (Number.isFinite(rawCost)) {
                    td.title = col.key === "cost_usd"
                        ? fmtCents(rawCost) + " (" + rawCost.toFixed(4) + " USD)"
                        : fmtUsdRound(rawCost) + " (" + rawCost.toFixed(4) + " USD)";
                }
            }
            td.appendChild(bar);
            td.appendChild(inner);
        }

        function renderColumnsPicker() {
            const list = document.getElementById("columnsList");
            list.replaceChildren();
            ALL_COLUMNS.forEach((col) => {
                const row = document.createElement("label");
                row.className = "col-opt";
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.checked = visibleColumnKeys.includes(col.key);
                cb.addEventListener("change", () => {
                    if (cb.checked) {
                        if (!visibleColumnKeys.includes(col.key)) {
                            visibleColumnKeys = [...visibleColumnKeys, col.key];
                        }
                    } else {
                        if (visibleColumnKeys.length === 1) {
                            cb.checked = true;
                            return;
                        }
                        visibleColumnKeys = visibleColumnKeys.filter((k) => k !== col.key);
                    }
                    visibleColumnKeys = ALL_COLUMNS.map((c) => c.key).filter((k) => visibleColumnKeys.includes(k));
                    saveUiState();
                    render();
                });
                const text = document.createElement("span");
                text.textContent = col.label;
                row.appendChild(cb);
                row.appendChild(text);
                list.appendChild(row);
            });
            document.getElementById("columnsBtn").textContent = "Columns (" + visibleColumnKeys.length + "/" + ALL_COLUMNS.length + ")";
            document.getElementById("columnsBtn").classList.toggle("active", columnsOpen);
        }

        function renderTableHeader() {
            const head = document.getElementById("tableHead");
            head.replaceChildren();
            const cols = ALL_COLUMNS.filter((c) => visibleColumnKeys.includes(c.key));
            cols.forEach((col) => {
                const th = document.createElement("th");
                th.textContent = col.label;
                if (col.align === "left") {
                    th.className = "col-left";
                }
                head.appendChild(th);
            });
        }

        function setColumnsMode(mode) {
            if (mode === "core") {
                visibleColumnKeys = CORE_COLUMN_KEYS.slice();
            } else {
                visibleColumnKeys = ALL_COLUMNS.map((c) => c.key);
            }
            saveUiState();
            render();
        }

        const RECENT_PROMPT_BARS = 24;

        function modelBucketKey(model) {
            const s = String(model ?? "").trim().toLowerCase();
            if (!s || s === "default") return "auto";
            return s;
        }

        function modelShortLabel(key) {
            if (key === "auto") return "Auto";
            let s = key.replace(/-thinking(-high|-medium)?$/i, "").replace(/^claude-/, "").replace(/-/g, " ");
            if (s.length > 22) return s.slice(0, 19) + "…";
            return s;
        }

        function timeHm(s) {
            if (!s) return "";
            const d = new Date(s);
            if (Number.isNaN(d.getTime())) return "";
            const hh = String(d.getHours()).padStart(2, "0");
            const mi = String(d.getMinutes()).padStart(2, "0");
            return hh + ":" + mi;
        }

        function recentAgentTurnsChron() {
            const list = (boot.rows || []).filter((r) => isBillableEvent(r.event)).slice();
            list.sort((a, b) => String(a.at).localeCompare(String(b.at)));
            return list.slice(-RECENT_PROMPT_BARS);
        }

        function modelBucketsLast7d() {
            const ins = boot.costInsights;
            if (ins && ins.last7dByModel && ins.last7dByModel.length) {
                return ins.last7dByModel;
            }
            const end = Date.now();
            const start = end - 7 * 86400000;
            const map = new Map();
            (boot.rows || []).forEach((r) => {
                if (!isBillableEvent(r.event)) return;
                const d = new Date(String(r.at));
                if (Number.isNaN(d.getTime()) || d.getTime() < start) return;
                const key = modelBucketKey(r.model);
                const hit = map.get(key) || { label: modelShortLabel(key), turns: 0, costUsd: 0, totalTokens: 0, modelKey: key };
                hit.turns += 1;
                hit.costUsd += Number(r.cost_usd || 0);
                hit.totalTokens += Number(r.total_tokens || 0);
                map.set(key, hit);
            });
            return [...map.values()]
                .map((v) => ({
                    modelKey: v.modelKey,
                    label: v.label,
                    turns: v.turns,
                    costUsd: v.costUsd,
                    totalTokens: v.totalTokens,
                    avgCostUsd: v.turns ? v.costUsd / v.turns : 0,
                    usdPerMTokens: v.totalTokens ? (v.costUsd / v.totalTokens) * 1_000_000 : 0,
                }))
                .sort((a, b) => b.costUsd - a.costUsd);
        }

        function renderPromptTimeSeries(turns) {
            const wrap = document.createElement("div");
            if (!turns.length) {
                wrap.className = "insight-foot";
                wrap.textContent = "No agent turns yet.";
                return wrap;
            }
            const maxCost = Math.max(...turns.map((r) => Number(r.cost_usd) || 0), 0.0001);
            const chart = document.createElement("div");
            chart.className = "ts-chart";
            turns.forEach((r) => {
                const col = document.createElement("div");
                col.className = "ts-col";
                const cost = Number(r.cost_usd) || 0;
                const bar = document.createElement("div");
                bar.className = "ts-bar";
                bar.style.height = Math.max(3, Math.round((cost / maxCost) * 96)) + "px";
                col.title =
                    shortAt(r.at) + " · " + fmtUsdShort(cost) + " · " + modelShortLabel(modelBucketKey(r.model));
                const lbl = document.createElement("span");
                lbl.className = "ts-lbl";
                lbl.textContent = timeHm(r.at);
                col.appendChild(bar);
                col.appendChild(lbl);
                chart.appendChild(col);
            });
            wrap.appendChild(chart);
            const cap = document.createElement("div");
            cap.className = "insight-foot";
            cap.textContent =
                "Bar height = turn cost (USD). Oldest → newest, last " + turns.length + " prompts. Hover for model.";
            wrap.appendChild(cap);
            return wrap;
        }

        function renderModelAvgTable(buckets, title) {
            const card = document.createElement("div");
            card.className = "insight-card";
            const h = document.createElement("h3");
            h.textContent = title;
            card.appendChild(h);
            const table = document.createElement("table");
            table.className = "cmp-table";
            const thead = document.createElement("thead");
            thead.innerHTML =
                "<tr><th>Model</th><th>Prompts</th><th>Avg $/prompt</th><th>Avg $/M tok</th></tr>";
            table.appendChild(thead);
            const tbody = document.createElement("tbody");
            if (!buckets.length) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 4;
                td.textContent = "No turns in window.";
                tr.appendChild(td);
                tbody.appendChild(tr);
            } else {
                buckets.forEach((b) => {
                    const tr = document.createElement("tr");
                    [b.label, String(b.turns), fmtUsdShort(b.avgCostUsd), fmtUsdPerM(b.usdPerMTokens)].forEach(
                        (text, i) => {
                            const td = document.createElement("td");
                            td.textContent = text;
                            if (i === 0) td.title = b.modelKey;
                            tr.appendChild(td);
                        }
                    );
                    tbody.appendChild(tr);
                });
            }
            table.appendChild(tbody);
            card.appendChild(table);
            return card;
        }

        function renderAvgPerPromptBars(buckets) {
            const card = document.createElement("div");
            card.className = "insight-card";
            card.innerHTML = "<h3>Avg cost per prompt by model (7d)</h3>";
            const top = buckets.slice(0, 8);
            const max = Math.max(...top.map((b) => b.avgCostUsd), 0.0001);
            const chart = document.createElement("div");
            chart.className = "bar-chart";
            top.forEach((b) => {
                const row = document.createElement("div");
                row.className = "bar-row";
                const lbl = document.createElement("span");
                lbl.className = "lbl";
                lbl.textContent = b.label;
                const track = document.createElement("div");
                track.className = "bar-track";
                const fill = document.createElement("div");
                fill.className = "bar-fill";
                fill.style.width = Math.max(4, Math.round((b.avgCostUsd / max) * 100)) + "%";
                track.appendChild(fill);
                const val = document.createElement("span");
                val.textContent = fmtUsdShort(b.avgCostUsd);
                row.appendChild(lbl);
                row.appendChild(track);
                row.appendChild(val);
                chart.appendChild(row);
            });
            card.appendChild(chart);
            return card;
        }

        function renderAvgPerTokenBars(buckets) {
            const card = document.createElement("div");
            card.className = "insight-card";
            card.innerHTML = "<h3>Avg cost per token by model (7d, $/M)</h3>";
            const top = buckets.slice(0, 8);
            const max = Math.max(...top.map((b) => b.usdPerMTokens), 0.0001);
            const chart = document.createElement("div");
            chart.className = "bar-chart";
            top.forEach((b) => {
                const row = document.createElement("div");
                row.className = "bar-row";
                const lbl = document.createElement("span");
                lbl.className = "lbl";
                lbl.textContent = b.label;
                const track = document.createElement("div");
                track.className = "bar-track";
                const fill = document.createElement("div");
                fill.className = "bar-fill";
                fill.style.width = Math.max(4, Math.round((b.usdPerMTokens / max) * 100)) + "%";
                track.appendChild(fill);
                const val = document.createElement("span");
                val.textContent = fmtUsdPerM(b.usdPerMTokens);
                row.appendChild(lbl);
                row.appendChild(track);
                row.appendChild(val);
                chart.appendChild(row);
            });
            card.appendChild(chart);
            return card;
        }

        function renderInsights() {
            const wrap = document.getElementById("insightsWrap");
            const body = document.getElementById("insightsBody");
            wrap.classList.toggle("collapsed", !insightsOpen);
            document.getElementById("insightsToggleBtn").textContent = insightsOpen ? "Hide" : "Show";
            document.getElementById("insightsBtn").classList.toggle("active", insightsOpen);
            body.replaceChildren();

            const turns = recentAgentTurnsChron();
            const buckets = modelBucketsLast7d();
            const grid = document.createElement("div");
            grid.className = "insights-grid";

            const tsCard = document.createElement("div");
            tsCard.className = "insight-card";
            tsCard.innerHTML = "<h3>Recent prompt cost (time series)</h3>";
            tsCard.appendChild(renderPromptTimeSeries(turns));
            grid.appendChild(tsCard);

            const pair = document.createElement("div");
            pair.className = "insights-grid";
            pair.style.display = "grid";
            pair.style.gridTemplateColumns = "1fr 1fr";
            pair.style.gap = ".5rem";
            pair.appendChild(renderAvgPerPromptBars(buckets));
            pair.appendChild(renderAvgPerTokenBars(buckets));
            grid.appendChild(pair);

            grid.appendChild(renderModelAvgTable(buckets, "By model summary (last 7 days UTC)"));
            body.appendChild(grid);
        }

        function render() {
            const rows = boot.rows || [];
            const day = boot.dayTotals || { cost_usd: 0, total_tokens: 0, output_tokens: 0, turn_count: 0 };
            const daily = boot.dailySnapshot;
            const empty = document.getElementById("emptyHint");
            const body = document.getElementById("tableBody");
            const csvName = boot.csvPath ? boot.csvPath.split("/").pop() : "csv";
            let meta =
                (rows.length ? rows.length + " rows · " : "") +
                (boot.dataSource === "sqlite" ? "SQLite · " : csvName + " · ") +
                shortAt(boot.generatedAt);
            if (boot.costMismatchCount > 0) {
                meta += " · ⚠ " + boot.costMismatchCount + " cost mismatch";
            }
            document.getElementById("meta").textContent = meta;
            document.getElementById("columnsWrap").classList.toggle("open", columnsOpen);

            const dayCumCost = daily ? Number(daily.cumulative_cost_usd || daily.cost_usd || 0) : day.cost_usd;
            const dayCumTok = daily ? Number(daily.cumulative_total_tokens || daily.total_tokens || 0) : day.total_tokens;
            const dayTurnSpend = day.cost_usd;
            const dayTurnTier = tierUsdSession(dayTurnSpend);
            const dayCumTier = tierUsdSession(dayCumCost);

            paintSummary(document.getElementById("daySummary"), [
                ["Turn spend", fmtUsdShort(dayTurnSpend), dayTurnTier.text.join(" ")],
                ["Day cum", fmtUsdRound(dayCumCost), dayCumTier.text.join(" ")],
                ["Turns", fmtInt(day.turn_count), ""],
                ["Turn tok", fmtTok(day.total_tokens), tierTokenCount(day.total_tokens, 200000, 500000).text.join(" ")],
                ["Day cum tok", fmtTok(dayCumTok), tierTokenCount(dayCumTok, 500000, 1e6).text.join(" ")],
                ["Out tok", fmtTok(day.output_tokens), ""],
            ]);

            renderInsights();
            renderColumnsPicker();
            renderTableHeader();
            const cols = ALL_COLUMNS.filter((c) => visibleColumnKeys.includes(c.key));

            const list = filteredRows();
            const maxima = columnMaxima(list, cols);
            body.replaceChildren();
            if (!list.length) {
                empty.style.display = "block";
                empty.textContent = rows.length
                    ? "No rows match filter."
                    : boot.hooksInstalled === false && !(boot.cloudSync && boot.cloudSync.apiKeyConfigured)
                        ? "Install IDE hooks and/or set a Cloud API key (Token Telemetry: Set Cloud API Key)."
                        : "No usage rows yet.";
            } else {
                empty.style.display = "none";
                const latestKey = rowKey(list[0]);
                list.forEach((r) => {
                    const tr = document.createElement("tr");
                    if (r.event === "daily") tr.className = "event-daily";
                    if (rowKey(r) === latestKey) tr.classList.add("row-latest");
                    cols.forEach((col) => {
                        const td = document.createElement("td");
                        if (col.align === "left") {
                            td.classList.add("col-left");
                        }
                        appendCell(td, col, r, maxima);
                        tr.appendChild(td);
                    });
                    body.appendChild(tr);
                });
            }
        }

        function rowKey(r) {
            return String(r.at) + "|" + String(r.generation_id || "") + "|" + String(r.event || "");
        }

        document.getElementById("reloadBtn").onclick = () => vscode.postMessage({ type: "refresh" });
        document.getElementById("popOutBtn").onclick = () => vscode.postMessage({ type: "popOut" });
        document.getElementById("turnsOnly").onchange = () => {
            saveUiState();
            render();
        };
        document.getElementById("columnsBtn").onclick = () => {
            columnsOpen = !columnsOpen;
            saveUiState();
            render();
        };
        document.getElementById("colsCoreBtn").onclick = () => setColumnsMode("core");
        document.getElementById("colsAllBtn").onclick = () => setColumnsMode("all");
        document.getElementById("insightsBtn").onclick = () => {
            insightsOpen = !insightsOpen;
            saveUiState();
            render();
        };
        document.getElementById("insightsToggleBtn").onclick = () => {
            insightsOpen = !insightsOpen;
            saveUiState();
            render();
        };

        window.addEventListener("message", (e) => {
            if (e.data && e.data.type === "update") {
                boot = e.data.payload;
                render();
            }
        });
        render();
    </script>
</body>
