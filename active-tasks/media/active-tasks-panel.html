                if (ev.relatedTarget && col.contains(ev.relatedTarget)) return;
                col.classList.remove("drop-target");
            });
            col.addEventListener("drop", (ev) => {
                if (!draggedId) return;
                ev.preventDefault();
                clearBoardDropTargets();
                applyBoardDrop(draggedId, tone);
            });
        }

        // Reuses the status-grouping move message, so the board needs no host
        // handler of its own. Archive columns finish the row instead.
        function applyBoardDrop(dragId, tone) {
            const drag = (boot.activeTasks.todos || []).find((t) => t.id === dragId);
            if (!drag) return;
            if (isDoneTone(tone)) {
                markTodoDone(dragId, tone === "wont_fix" ? "wont_fix" : "manual");
                return;
            }
            if (statusToneForTodo(drag) === tone) return;
            const bucket = STATUS_BUCKETS.find((b) => b.tone === tone);
            const sync = {
                status: bucket ? bucket.label : "Backlog",
                status_key: statusKeyForTone(tone),
            };
            applyGroupSyncToTodo(drag, sync);
            vscode.postMessage({ type: "moveTaskToSection", childId: dragId, groupSync: sync });
            scheduleRender();
        }

        function buildBoardColumn(bucket, items, childrenByParent) {
            const col = document.createElement("section");
            col.className = "board-col";
            if (isDoneTone(bucket.tone)) col.classList.add("board-col-done");
            col.dataset.tone = bucket.tone;

            const head = document.createElement("div");
            head.className = "board-col-head";
            const dot = document.createElement("span");
            dot.className = "bc-dot";
            dot.style.background = BOARD_COL_DOT[bucket.tone] || "var(--accent)";
            head.appendChild(dot);
            const h2 = document.createElement("h2");
            h2.textContent = bucket.label;
            h2.title = bucket.label;
            head.appendChild(h2);
            const count = document.createElement("span");
            count.className = "bc-count";
            count.textContent = String(items.length);
            head.appendChild(count);
            col.appendChild(head);

            const body = document.createElement("div");
            body.className = "board-col-body";
            if (!items.length) {
                const empty = document.createElement("p");
                empty.className = "board-col-empty";
                empty.textContent = isDoneTone(bucket.tone) ? "Drop to mark done" : "Drop here";
                body.appendChild(empty);
            } else {
                items.forEach((t) => body.appendChild(buildBoardCard(t, childrenByParent, 0)));
            }
            col.appendChild(body);

            wireBoardColumnDrop(col, bucket.tone);
            return col;
        }

        function boardRootTodos(openTodos) {
            const ids = new Set(openTodos.map((t) => t.id));
            return openTodos.filter((t) => {
                const p = (t.parent_id || "").trim();
                return !p || !ids.has(p);
            });
        }

        function renderBoard(root, openTodos) {
            const board = document.createElement("div");
            board.className = "board";
            const childrenByParent = hideNested ? null : indexChildrenByParent(openTodos);
            const roots = hideNested ? openTodos : boardRootTodos(openTodos);
            STATUS_BUCKETS.forEach((bucket) => {
                const items = hideNested
                    ? openTodos.filter((t) => statusToneForTodo(t) === bucket.tone)
                    : roots.filter((t) => statusToneForTodo(t) === bucket.tone);
                board.appendChild(buildBoardColumn(bucket, items, childrenByParent));
            });
            ARCHIVE_BUCKETS.forEach((bucket) => {
                board.appendChild(buildBoardColumn(bucket, [], null));
            });
            root.appendChild(board);
        }

        // A board column is too narrow for the task page, so in board mode the
        // same builder renders into a centered overlay instead of inline.
        function openTaskPageModal(todo) {
            const modal = document.getElementById("taskPageModal");
            const card = document.getElementById("taskPageModalCard");
            if (!modal || !card) return;
            card.replaceChildren(buildExpandPanel(todo));
            modal.classList.remove("hidden");
        }

        function closeTaskPageModal() {
            const modal = document.getElementById("taskPageModal");
            if (!modal || modal.classList.contains("hidden")) return;
            modal.classList.add("hidden");
            document.getElementById("taskPageModalCard").replaceChildren();
        }

        function syncTaskPageModal() {
            const todo = viewMode === "board" && expandedId ? cardTodoById(expandedId) : null;
            if (!todo) {
                closeTaskPageModal();
                return;
            }
            openTaskPageModal(todo);
        }

        function splitPinnedTodos(todos) {
            const pinned = [];
            const rest = [];
            todos.forEach((t) => {
                if (t.pinned) pinned.push(t);
                else rest.push(t);
            });
            return { pinned, rest };
        }

        function renderOpen(root, openTodos) {
            if (viewMode === "board") {
                renderBoard(root, openTodos);
                return;
            }
            const { pinned, rest } = splitPinnedTodos(openTodos);
            if (pinned.length) {
                root.appendChild(listSection("Pinned", pinned, "var(--accent)"));
            }
            if (groupMode === "repo") {
                groupByRepo(root, rest);
            } else if (groupMode === "status") {
                groupByStatus(root, rest);
            } else if (rest.length) {
                root.appendChild(listSection("Open", rest, null));
            } else if (!pinned.length) {
                root.appendChild(listSection("Open", [], null));
            }
        }

        function renderRepoSummary(openTodos) {
            const wrap = document.getElementById("repoSummary");
            wrap.replaceChildren();
            const counts = {};
            openTodos.forEach((t) => {
                const k = repoKey(t.repo) || "unknown";
                counts[k] = (counts[k] || 0) + 1;
            });
            REPO_ORDER.forEach((key) => {
                if (!counts[key]) return;
                const chipEl = document.createElement("span");
                chipEl.className = "rs-chip";
                const dot = document.createElement("span");
                dot.className = "dot";
                dot.style.background = REPO_VIS[key].accent;
                chipEl.appendChild(dot);
                chipEl.appendChild(document.createTextNode(REPO_VIS[key].name + " "));
                const cnt = document.createElement("span");
                cnt.className = "rs-count";
                cnt.textContent = String(counts[key]);
                chipEl.appendChild(cnt);
                wrap.appendChild(chipEl);
            });
        }

        function setFilter(next) {
            filter = next;
            saveUiState();
            document.querySelectorAll('.seg [data-filter]').forEach((btn) => {
                const on = btn.dataset.filter === filter;
                btn.classList.toggle("active", on);
                btn.setAttribute("aria-selected", on ? "true" : "false");
            });
            scheduleRender();
        }

        function setGroup(next) {
            groupMode = GROUP_MODES.has(next) ? next : "list";
            saveUiState();
            updateGroupPickerUi();
            scheduleRender();
        }

        function updateViewToggleUi() {
            document.querySelectorAll(".seg [data-view]").forEach((btn) => {
                const on = btn.dataset.view === viewMode;
                btn.classList.toggle("active", on);
                btn.setAttribute("aria-selected", on ? "true" : "false");
            });
            // Grouping is a list-only concern; the board always groups by status.
            const group = document.getElementById("groupPicker");
            if (group) group.classList.toggle("hidden", viewMode === "board");
            updateHideNestedUi();
        }

        function updateHideNestedUi() {
            const btn = document.getElementById("hideNestedBtn");
            if (!btn) return;
            btn.classList.toggle("active", hideNested);
            btn.setAttribute("aria-checked", hideNested ? "true" : "false");
            // List omits children; board flattens them into columns (plan contract).
            const onLabel = viewMode === "board"
                ? "Show nested under parents"
                : "Show nested tasks";
            const offLabel = viewMode === "board"
                ? "Flatten nested into columns"
                : "Hide nested tasks";
            btn.title = hideNested ? onLabel : offLabel;
            btn.setAttribute("aria-label", hideNested ? onLabel : offLabel);
        }

        function setHideNested(next) {
            hideNested = Boolean(next);
            saveUiState();
            updateHideNestedUi();
            scheduleRender();
        }

        function setView(next) {
            viewMode = next === "board" ? "board" : "list";
            saveUiState();
            updateViewToggleUi();
            scheduleRender();
        }

        function renderFootMeta(parts) {
            document.getElementById("footMeta").textContent = parts.join(" · ");
        }

        function renderPanelNotice() {
            const el = document.getElementById("panelNotice");
            const notice = boot.notice || (boot.loadError
                ? { level: "error", title: "Database unavailable", detail: boot.loadError, action: "retry" }
                : null);
            if (!notice) {
                el.classList.add("hidden");
                el.replaceChildren();
                return;
            }
            el.classList.remove("hidden");
            el.classList.toggle("warn", notice.level === "warn");
            el.replaceChildren();
            const title = document.createElement("strong");
            title.textContent = notice.title || "Something went wrong";
            el.appendChild(title);
            if (notice.detail) {
                const detail = document.createElement("div");
                detail.className = "panel-notice-detail";
                detail.textContent = notice.detail;
                el.appendChild(detail);
            }
            const actions = document.createElement("div");
            actions.className = "panel-notice-actions";
            if (notice.action === "retry" || notice.action === "sync") {
                const retry = document.createElement("button");
                retry.type = "button";
                retry.textContent = notice.action === "sync" ? "Sync again" : "Retry";
                retry.addEventListener("click", () => {
                    if (notice.action === "sync") {
                        vscode.postMessage({ type: "resyncDatabase" });
                    } else {
                        requestRefresh();
                    }
                });
                actions.appendChild(retry);
            }
            if (notice.action === "openDb" || boot.loadError) {
                const db = document.createElement("button");
                db.type = "button";
                db.textContent = "Open database";
                db.addEventListener("click", () => vscode.postMessage({ type: "openDatabase" }));
                actions.appendChild(db);
            }
            const dismiss = document.createElement("button");
            dismiss.type = "button";
            dismiss.textContent = "Dismiss";
            dismiss.addEventListener("click", () => vscode.postMessage({ type: "dismissNotice" }));
            actions.appendChild(dismiss);
            el.appendChild(actions);
        }

        function renderNow() {
            renderPanelNotice();
            const activeTasks = boot.activeTasks || {};
            const serverTodos = activeTasks.todos || [];
            if (expandedId && !serverTodos.some((t) => t.id === expandedId)) {
                expandedId = null;
                saveUiState();
            }
            if (boot.loadError) {
                document.getElementById("emptyLoadError").classList.add("hidden");
            } else {
                document.getElementById("emptyLoadError").classList.add("hidden");
            }
            if (activeTasks.source) {
                const pathEl = document.getElementById("emptyDbPath");
                pathEl.textContent = "Source: " + activeTasks.source;
            }
            if (
                workspaceOnly &&
                serverTodos.filter((t) => !t.done).length > 0 &&
                serverTodos.filter((t) => !t.done && taskAppliesToWorkspaceContext(t)).length === 0
            ) {
                workspaceOnly = false;
                saveUiState();
            }
            let todos = serverTodos;
            const q = searchText.trim().toLowerCase();
            if (q) {
                todos = todos.filter((t) => todoMatchesSearch(t, q));
            }
            if (workspaceOnly) {
                todos = todos.filter(todoMatchesWorkspace);
            }
            const baseOpenTodos = todos.filter((t) => !t.done);
            let openTodos = applyPillFilter(baseOpenTodos);
            const doneTodos = todos.filter((t) => t.done);
            const doneCount = doneTodos.length;
            const total = todos.length;
            const open = openTodos.length;
            const pct = total ? Math.round((doneCount / total) * 100) : 0;

            const openCountEl = document.getElementById("openCount");
            if (awaitingPayload && !boot.generatedAt) {
                openCountEl.textContent = "—";
                openCountEl.classList.add("loading");
            } else {
                awaitingPayload = false;
                openCountEl.classList.remove("loading");
                openCountEl.textContent = total ? String(open) + " open" : "—";
            }
            document.getElementById("statsSub").textContent = total
                ? doneCount + " done · " + total + " total"
                : "Waiting for tasks";

            const barFill = document.getElementById("statsBarFill");
            if (barFill) {
                barFill.style.width = (total ? pct : 0) + "%";
            }

            renderRepoSummary(openTodos);
            renderFilterPills(baseOpenTodos);

            const empty = document.getElementById("emptyHint");
            const root = document.getElementById("sectionsRoot");
            root.replaceChildren();
            root.classList.toggle("grouped", groupMode !== "list");

            const filterLabel = activeViewFilterLabel();
            const filteredOut =
                filter === "open" &&
                !openTodos.length &&
                baseOpenTodos.length > 0;

            if (!total) {
                empty.classList.add("hidden");
                if (q || (filterLabel && filter !== "done")) {
                    renderFilteredEmpty(root, filterLabel || "search");
                } else if (!q) {
                    empty.classList.remove("hidden");
                    document.getElementById("emptyDbPath").classList.remove("hidden");
                }
                const disc = boot.discovery || {};
                const footParts = [];
                if (disc.scannedAt) footParts.push("Scan " + shortAt(disc.scannedAt));
                footParts.push("Refreshed " + shortAt(boot.generatedAt));
                renderFootMeta(footParts);
                syncTaskPageModal();
                return;
            }
            empty.classList.add("hidden");

            if (filter === "open") {
                if (openTodos.length) {
                    renderOpen(root, openTodos);
                } else if (filteredOut && filterLabel) {
                    renderFilteredEmpty(root, filterLabel);
                } else if (q && !baseOpenTodos.length) {
                    renderFilteredEmpty(root, "search");
                } else {
                    const hint = document.createElement("div");
                    hint.className = "empty";
                    hint.innerHTML = "<strong>Inbox zero</strong> All tasks complete.";
                    root.appendChild(hint);
                }
            } else if (filter === "all") {
                if (openTodos.length) renderOpen(root, openTodos);
                if (doneTodos.length) root.appendChild(listSection("Done", doneTodos, "var(--border)"));
            } else if (doneTodos.length) {
                root.appendChild(listSection("Done", doneTodos, "var(--border)"));
            } else {
                const hint = document.createElement("div");
                hint.className = "empty";
                hint.innerHTML = "<strong>Nothing done yet</strong> Complete a task to see it here.";
                root.appendChild(hint);
            }

            const footParts = [];
            footParts.push(
                viewMode === "board"
                    ? "Drag a card to another column to set its status"
                    : groupMode === "repo"
                        ? "Drag ⠿ — edges reorder; center nests; drop section header to set repo"
                        : groupMode === "status"
                            ? "Drag ⠿ — edges reorder; center nests; drop section header to set status"
                            : "Drag ⠿ — edges reorder; center nests"
            );
            if (activeTasks.updatedAt) {
                footParts.push("Snapshot " + shortAt(activeTasks.updatedAt));
            } else if (activeTasks.source) {
                footParts.push("SQLite active work");
            }
            const disc = boot.discovery || {};
            if (disc.scannedAt) footParts.push("Scan " + shortAt(disc.scannedAt));
            footParts.push("Refreshed " + shortAt(boot.generatedAt));
            renderFootMeta(footParts);

            syncTaskPageModal();

            if (kbdFocusId) {
                const focused = cardElementById(kbdFocusId);
                if (focused) {
                    focused.classList.add("kbd-focus");
                } else {
                    kbdFocusId = null;
                }
            }

            restoreEditFocus();
        }

        // The host pushes a full update after every write, so the rebuild that
        // follows a commit would otherwise drop the caret to <body> every time.
        function restoreEditFocus() {
            if (!lastEditFocus) return;
            const target = lastEditFocus;
            lastEditFocus = null;
            if (document.activeElement && document.activeElement !== document.body) return;
            const card = cardElementById(target.id);
            const el = card && card.querySelector(
                '.editable[data-edit-field="' + target.field + '"]'
            );
            if (el) el.focus();
        }

        document.getElementById("quickAddTitle").addEventListener("input", (ev) => {
            const form = document.getElementById("quickAddForm");
            form.classList.toggle("has-text", Boolean(ev.target.value.trim()));
        });

        document.getElementById("quickAddForm").addEventListener("submit", (ev) => {
            ev.preventDefault();
            const titleEl = document.getElementById("quickAddTitle");
            const statusEl = document.getElementById("quickAddStatus");
            const title = titleEl.value.trim();
            if (!title) return;
            vscode.postMessage({
                type: "quickAddWork",
                title,
                status: statusEl.value,
            });
            titleEl.value = "";
            titleEl.focus();
            document.getElementById("quickAddForm").classList.remove("has-text");
        });

        document.getElementById("emptyDbBtn").onclick = () => vscode.postMessage({ type: "openDatabase" });
        document.getElementById("emptySyncBtn").onclick = () => {
            setRefreshSpinning(true);
            vscode.postMessage({ type: "resyncDatabase" });
        };

        function invalidateAndRefresh() {
            requestRefresh();
        }

        document.getElementById("taskSearch").addEventListener("input", (ev) => {
            searchText = ev.target.value;
            document
                .getElementById("taskSearchClear")
                .classList.toggle("hidden", !searchText.trim());
            if (searchDebounce) {
                clearTimeout(searchDebounce);
            }
            searchDebounce = setTimeout(() => {
                searchDebounce = null;
                scheduleRender();
            }, 150);
        });
        document.getElementById("taskSearchClear").addEventListener("click", () => {
            searchText = "";
            document.getElementById("taskSearch").value = "";
            document.getElementById("taskSearchClear").classList.add("hidden");
            document.getElementById("taskSearch").focus();
            scheduleRender();
        });

        document.querySelectorAll('.seg [data-filter]').forEach((btn) => {
            btn.addEventListener("click", () => setFilter(btn.dataset.filter || "open"));
            const on = btn.dataset.filter === filter;
            btn.classList.toggle("active", on);
            btn.setAttribute("aria-selected", on ? "true" : "false");
        });

        document.querySelectorAll('.seg [data-view]').forEach((btn) => {
            btn.addEventListener("click", () => setView(btn.dataset.view || "list"));
        });
        updateViewToggleUi();

        document.getElementById("taskPageModal").addEventListener("click", (ev) => {
            if (ev.target.id === "taskPageModal") {
                expandedId = null;
                saveUiState();
                scheduleRender();
            }
        });
        document.getElementById("groupSelect").addEventListener("change", (ev) => {
            setGroup(ev.target.value);
        });
        updateGroupPickerUi();
        updateHideNestedUi();

        document.getElementById("reloadBtn").onclick = () => invalidateAndRefresh();
        document.getElementById("popOutBtn").onclick = () => vscode.postMessage({ type: "popOut" });
        document.getElementById("dbBtn").onclick = () => vscode.postMessage({ type: "openDatabase" });

        function hideMergeModal() {
            document.getElementById("mergeModal").classList.add("hidden");
        }

        function renderMergeSourceCheckboxes() {
            const primaryId = document.getElementById("mergePrimarySelect").value;
            const list = document.getElementById("mergeSourceList");
            list.replaceChildren();
            const open = (boot.activeTasks.todos || []).filter((t) => !t.done);
            open
                .filter((t) => t.id !== primaryId)
                .forEach((t) => {
                    const row = document.createElement("label");
                    const cb = document.createElement("input");
                    cb.type = "checkbox";
                    cb.value = t.id;
                    cb.checked = true;
                    row.appendChild(cb);
                    const span = document.createElement("span");
                    span.textContent =
                        (t.title || t.label || "Untitled") +
                        (t.repo ? " · " + t.repo : "");
                    row.appendChild(span);
                    list.appendChild(row);
                });
        }

        function showMergeModal() {
            const open = (boot.activeTasks.todos || []).filter((t) => !t.done);
            if (open.length < 2) {
                window.alert("You need at least two open tasks to merge.");
                return;
            }
            const sel = document.getElementById("mergePrimarySelect");
            sel.replaceChildren();
            const defaultPrimary =
                expandedId && open.some((t) => t.id === expandedId)
                    ? expandedId
                    : open[0].id;
            open.forEach((t) => {
                const o = document.createElement("option");
                o.value = t.id;
                o.textContent =
                    (t.title || t.label || "Untitled") +
                    (t.repo ? " (" + t.repo + ")" : "");
                if (t.id === defaultPrimary) {
                    o.selected = true;
                }
                sel.appendChild(o);
            });
            sel.onchange = () => renderMergeSourceCheckboxes();
            renderMergeSourceCheckboxes();
            document.getElementById("mergeModal").classList.remove("hidden");
            document.getElementById("mergeConfirmBtn").focus();
        }

        document.getElementById("mergeTasksBtn").onclick = () => showMergeModal();
        document.getElementById("mergeCancelBtn").onclick = () => hideMergeModal();
        document.getElementById("mergeModal").addEventListener("click", (ev) => {
            if (ev.target.id === "mergeModal") {
                hideMergeModal();
            }
        });
        document.getElementById("mergeConfirmBtn").onclick = () => {
            const primaryId = document.getElementById("mergePrimarySelect").value;
            const mergeIds = [
                ...document.querySelectorAll("#mergeSourceList input[type=checkbox]:checked"),
            ]
                .map((el) => el.value)
                .filter((id) => id && id !== primaryId);
            if (!mergeIds.length) {
                window.alert("Select at least one task to nest under the parent.");
                return;
            }
            const primary = (boot.activeTasks.todos || []).find((t) => t.id === primaryId);
            const ok = window.confirm(
                "Nest " +
                mergeIds.length +
                " task(s) under \"" +
                (primary ? primary.title || primary.label : "selected task") +
                "\"?"
            );
            if (!ok) {
                return;
            }
            hideMergeModal();
            postMergeWorkRows(primaryId, mergeIds);
        };

        function finishDone(mode) {
            if (doneModalTodoId) {
                vscode.postMessage({ type: "setDoneMode", id: doneModalTodoId, mode });
            }
            hideDoneModal();
        }
        document.getElementById("doneSessionBtn").onclick = () => finishDone("session");
        document.getElementById("donePersistBtn").onclick = () => finishDone("done");
        document.getElementById("doneRemoveBtn").onclick = () => finishDone("remove");
        document.getElementById("doneUndoBtn").onclick = () => hideDoneModal();
        document.getElementById("doneModal").addEventListener("click", (ev) => {
            if (ev.target.id === "doneModal") hideDoneModal();
        });
        document.addEventListener("keydown", (ev) => {
            if (ev.key === "Escape") {
                const mergeModal = document.getElementById("mergeModal");
                if (mergeModal && !mergeModal.classList.contains("hidden")) {
                    hideMergeModal();
                    return;
                }
                const taskPage = document.getElementById("taskPageModal");
                if (taskPage && !taskPage.classList.contains("hidden")) {
                    expandedId = null;
                    saveUiState();
                    scheduleRender();
                    return;
                }
            }
            if (ev.key === "Escape" && doneModalTodoId) {
                hideDoneModal();
                return;
            }
            if (doneModalTodoId) return;
            const tag = (ev.target && ev.target.tagName) || "";
            if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;

            const cards = visibleTaskCards();
            if (!cards.length) return;

            if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
                ev.preventDefault();
                let idx = cards.findIndex((c) => c.dataset.id === kbdFocusId);
                if (idx < 0) idx = 0;
                else idx += ev.key === "ArrowDown" ? 1 : -1;
                idx = Math.max(0, Math.min(cards.length - 1, idx));
                const nextId = cards[idx].dataset.id;
                setKbdFocus(nextId);
                cards[idx].focus();
                cards[idx].scrollIntoView({ block: "nearest" });
                return;
            }

            if (!kbdFocusId) return;
            const todo = cardTodoById(kbdFocusId);
            if (!todo) return;
            if (ev.key === "Enter") {
                ev.preventDefault();
                toggleExpanded(todo.id);
            } else if (ev.key === " " || ev.key === "x" || ev.key === "X") {
                ev.preventDefault();
                triggerDoneForTodo(todo);
            }
        });
        window.addEventListener("message", (e) => {
            if (e.data && e.data.type === "update") {
                boot = e.data.payload;
                setRefreshSpinning(false);
                vscode.setState({ ...(vscode.getState() || {}), hasRendered: true });
                scheduleRender();
            }
        });
        scheduleRender();
    </script>
</body>

</html>
