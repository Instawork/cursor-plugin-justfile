            titleEl.title = "Click to expand details";
            titleRow.appendChild(titleEl);

            const prN = prCountForTodo(todo);
            if (prN > 0) {
                const prBadge = document.createElement("span");
                prBadge.className = "pr-count-badge has-pr";
                prBadge.title = prN === 1 ? "1 linked PR" : prN + " linked PRs";
                prBadge.textContent = prN === 1 ? "PR" : "PR " + prN;
                titleRow.appendChild(prBadge);
            }

            body.appendChild(titleRow);

            const meta = buildMeta(todo);
            if (meta) body.appendChild(meta);
            const ci = ciBadgeForTodo(todo);
            if (ci) {
                const ciWrap = document.createElement("div");
                ciWrap.style.marginTop = ".25rem";
                ciWrap.appendChild(ci);
                body.appendChild(ciWrap);
            }

            head.appendChild(handle);
            head.appendChild(checkWrap);
            head.appendChild(badge);
            head.appendChild(body);
            card.appendChild(head);

            if (expandedId === todo.id) {
                card.appendChild(buildExpandPanel(todo));
            }

            card.addEventListener("click", (ev) => {
                if (ev.target.closest("a, button, input, textarea, select, label.check, .drag-handle, .task-expand-panel")) {
                    return;
                }
                toggleExpanded(todo.id);
            });
            if (kbdFocusId === todo.id) {
                card.classList.add("kbd-focus");
            }
            return card;
        }

        function visibleTaskCards() {
            return [...document.querySelectorAll("#sectionsRoot .task-card")];
        }

        function setKbdFocus(id) {
            if (kbdFocusId === id) {
                return;
            }
            kbdFocusId = id;
            document.querySelectorAll(".task-card.kbd-focus").forEach((el) => {
                el.classList.remove("kbd-focus");
            });
            if (!id) return;
            const card = document.querySelector(
                '.task-card[data-id="' + CSS.escape(id) + '"]'
            );
            if (card) {
                card.classList.add("kbd-focus");
            }
            saveUiState({ kbdFocusId: id });
        }

        function cardTodoById(id) {
            return (boot.activeTasks.todos || []).find((t) => t.id === id);
        }

        function triggerDoneForTodo(todo) {
            if (!todo || todo.done) return;
            showDoneModal(todo);
        }

        function wireDrag(card, handle) {
            card.addEventListener("dragstart", (ev) => {
                draggedId = card.dataset.id;
                card.classList.add("dragging");
                ev.dataTransfer.effectAllowed = "move";
                try { ev.dataTransfer.setData("text/plain", draggedId); } catch (e) { /* noop */ }
            });
            card.addEventListener("dragend", () => {
                draggedId = null;
                card.draggable = false;
                card.classList.remove("dragging");
                clearIndicators();
            });
            card.addEventListener("dragover", (ev) => {
                if (!draggedId || card.dataset.id === draggedId) return;
                if (card.dataset.group !== draggedGroup()) return;
                ev.preventDefault();
                ev.dataTransfer.dropEffect = "move";
                const rect = card.getBoundingClientRect();
                const after = ev.clientY > rect.top + rect.height / 2;
                clearIndicators();
                card.classList.add(after ? "drop-after" : "drop-before");
            });
            card.addEventListener("dragleave", () => {
                card.classList.remove("drop-before", "drop-after");
            });
            card.addEventListener("drop", (ev) => {
                if (!draggedId || card.dataset.id === draggedId) return;
                if (card.dataset.group !== draggedGroup()) return;
                ev.preventDefault();
                const rect = card.getBoundingClientRect();
                const after = ev.clientY > rect.top + rect.height / 2;
                applyReorder(draggedId, card.dataset.id, after);
                clearIndicators();
            });
        }

        function draggedGroup() {
            const el = document.querySelector(
                '.task-card[data-id="' + CSS.escape(draggedId) + '"]'
            );
            return el ? el.dataset.group : null;
        }

        function clearIndicators() {
            document.querySelectorAll(".task-card.drop-before, .task-card.drop-after")
                .forEach((el) => el.classList.remove("drop-before", "drop-after"));
        }

        function applyReorder(dragId, targetId, after) {
            const todos = (boot.activeTasks.todos || []);
            const ids = todos.map((t) => t.id).filter((id) => id !== dragId);
            let idx = ids.indexOf(targetId);
            if (idx < 0) {
                ids.push(dragId);
            } else {
                if (after) idx += 1;
                ids.splice(idx, 0, dragId);
            }
            const byId = new Map(todos.map((t) => [t.id, t]));
            boot.activeTasks.todos = ids.map((id) => byId.get(id)).filter(Boolean);
            vscode.postMessage({ type: "reorderTodos", order: ids });
            scheduleRender();
        }

        function sectionHead(title, count, dotColor) {
            const head = document.createElement("div");
            head.className = "section-head";
            if (dotColor) {
                const dot = document.createElement("span");
                dot.className = "sh-dot";
                dot.style.background = dotColor;
                head.appendChild(dot);
            }
            const h2 = document.createElement("h2");
            h2.textContent = title;
            const c = document.createElement("span");
            c.className = "section-count";
            c.textContent = String(count);
            head.appendChild(h2);
            head.appendChild(c);
            return head;
        }

        function listSection(title, todos, dotColor) {
            const wrap = document.createElement("section");
            wrap.className = "section";
            wrap.appendChild(sectionHead(title, todos.length, dotColor));
            const list = document.createElement("div");
            list.className = "task-cards";
            todos.forEach((t) => list.appendChild(buildTaskCard(t)));
            wrap.appendChild(list);
            return wrap;
        }

        function groupByRepo(root, todos) {
            const seen = new Set();
            REPO_ORDER.forEach((key) => {
                const items = todos.filter((t) => repoKey(t.repo) === key);
                items.forEach((t) => seen.add(t.id));
                if (items.length) {
                    root.appendChild(listSection(REPO_VIS[key].name, items, REPO_VIS[key].accent));
                }
            });
            const rest = todos.filter((t) => !seen.has(t.id));
            if (rest.length) root.appendChild(listSection("Other", rest, "var(--muted)"));
        }

        function groupByStatus(root, todos) {
            STATUS_BUCKETS.forEach((bucket) => {
                const items = todos.filter((t) => statusTone(t.status) === bucket.tone);
                if (items.length) {
                    const dot = {
                        blocked: "var(--status-blocked-fg)",
                        review: "var(--status-review-fg)",
                        progress: "var(--status-progress-fg)",
                        ready: "var(--status-ready-fg)",
                        paused: "var(--muted)",
                        default: "var(--accent)",
                    }[bucket.tone];
                    root.appendChild(listSection(bucket.label, items, dot));
                }
            });
        }

        function renderDiscovery(root) {
            const disc = boot.discovery || {};
            const missing = disc.missingPrs || [];
            const stale = disc.staleTrackedPrs || [];
            const cloud = disc.cloudAgents || [];
            const untrackedCloud = new Set((disc.untrackedCloudAgents || []).map((a) => a.agentId));
            const reconcileCount = missing.length + untrackedCloud.size + stale.length;
            const structural = disc.structuralMergeCandidates || [];
            const agentHint = disc.agentConsolidation || {};
            const needsAgentConsolidate = Boolean(agentHint.overRecommended);
            const hasScan = Boolean(disc.scannedAt);
            if (
                !hasScan &&
                !reconcileCount &&
                !structural.length &&
                !needsAgentConsolidate &&
                !cloud.length &&
                !disc.githubError &&
                !disc.cloudError
            ) {
                return;
            }

            const wrap = document.createElement("section");
            wrap.className = "section";

            const details = document.createElement("details");
            details.className = "reconcile-details";
            details.open =
                pillFilter === "needsReconcile" ||
                reconcileCount > 0 ||
                structural.length > 0 ||
                needsAgentConsolidate;

            const summary = document.createElement("summary");
            const summaryParts = ["Reconcile"];
            if (missing.length) summaryParts.push(missing.length + " inbound");
            if (stale.length) summaryParts.push(stale.length + " stale");
            const agentCount = untrackedCloud.size;
            if (agentCount) summaryParts.push(agentCount + " agent");
            if (structural.length) summaryParts.push(structural.length + " duplicate");
            if (needsAgentConsolidate) summaryParts.push("consolidate (agent)");
            if (summaryParts.length === 1 && disc.scannedAt) {
                summaryParts.push("up to date");
            }
            summary.textContent = summaryParts.join(" · ");
            details.appendChild(summary);

            const hint = document.createElement("p");
            hint.className = "disc-hint";
            const parts = [];
            if (reconcileCount === 0 && disc.scannedAt) {
                const rel = relativeScanAge(disc.scannedAt);
                hint.textContent = "✓ All PRs and cloud agents tracked · scanned " + rel;
                if (scanIsStale(disc.scannedAt)) {
                    hint.classList.add("stale-scan");
                }
            } else if (disc.scannedAt) {
                parts.push("Scanned " + shortAt(disc.scannedAt));
            }
            if (disc.githubError) parts.push("GitHub: " + disc.githubError);
            if (disc.cloudError) parts.push("Cloud: " + disc.cloudError);
            if (!hint.textContent) {
                hint.textContent = parts.length
                    ? parts.join(" · ")
                    : "Inbound (untracked) and outbound (stale) vs your active work list.";
            }
            details.appendChild(hint);

            const cards = document.createElement("div");
            cards.className = "disc-cards";

            if (needsAgentConsolidate || (agentHint.openCount && agentHint.openCount > 6)) {
                const card = document.createElement("article");
                card.className = "disc-card";
                const title = document.createElement("p");
                title.className = "disc-title";
                title.textContent =
                    "Consolidate with Agent · " +
                    (agentHint.openCount || "?") +
                    " open rows (target 3–8)";
                card.appendChild(title);
                const sub = document.createElement("p");
                sub.className = "disc-hint";
                sub.textContent =
                    "Grouping related initiatives is semantic — use Agent to merge rows, not automatic title matching.";
                card.appendChild(sub);
                const actions = document.createElement("div");
                actions.className = "disc-actions";
                actions.appendChild(
                    discActionBtn("Copy brief for Agent", () => {
                        vscode.postMessage({ type: "copyAgentConsolidationBrief" });
                    })
                );
                card.appendChild(actions);
                cards.appendChild(card);
            }

            structural.slice(0, RECONCILE_CARD_CAP).forEach((sug) => {
                const card = document.createElement("article");
                card.className = "disc-card untracked";
                const title = document.createElement("p");
                title.className = "disc-title";
                title.textContent =
                    "Merge " +
                    (1 + sug.mergeIds.length) +
                    " rows · " +
                    (sug.reason || "Related work");
                card.appendChild(title);
                const list = document.createElement("ul");
                list.className = "disc-hint";
                list.style.margin = "0.35rem 0 0";
                list.style.paddingLeft = "1.1rem";
                (sug.titles || []).forEach((t) => {
                    const li = document.createElement("li");
                    li.textContent = t;
                    list.appendChild(li);
                });
                card.appendChild(list);
                const actions = document.createElement("div");
                actions.className = "disc-actions";
                actions.appendChild(
                    discActionBtn("Merge duplicates", () => {
                        vscode.postMessage({
                            type: "mergeWorkRows",
                            primaryId: sug.primaryId,
                            mergeIds: sug.mergeIds,
                        });
                    })
                );
                card.appendChild(actions);
                cards.appendChild(card);
            });

            stale.slice(0, RECONCILE_CARD_CAP).forEach((row) => {
                const card = document.createElement("article");
                card.className = "disc-card untracked";
                const title = document.createElement("p");
                title.className = "disc-title";
                title.textContent = "Stale: " + row.title + " · PR #" + row.prNumber;
                card.appendChild(title);
                const meta = document.createElement("div");
                meta.className = "disc-meta";
                const st = document.createElement("span");
                st.className = "disc-pill";
                st.textContent = row.state || "not open";
                meta.appendChild(st);
                card.appendChild(meta);
                const actions = document.createElement("div");
                actions.className = "disc-actions";
                actions.appendChild(discActionBtn("Remove row", () => {
                    vscode.postMessage({ type: "reconcileRemoveRow", id: row.todoId });
                }));
                actions.appendChild(discActionBtn("Open PR", () => openExternalUrl(row.prUrl)));
                card.appendChild(actions);
                cards.appendChild(card);
            });

            missing.slice(0, RECONCILE_CARD_CAP).forEach((pr) => {
                const card = document.createElement("article");
                card.className = "disc-card untracked";
                const title = document.createElement("p");
                title.className = "disc-title";
                const a = document.createElement("a");
                a.href = "#";
                a.textContent = "PR #" + pr.number + " " + (pr.title || "");
                a.addEventListener("click", (ev) => {
                    ev.preventDefault();
                    openExternalUrl(pr.url);
                });
                title.appendChild(a);
                card.appendChild(title);
                const meta = document.createElement("div");
                meta.className = "disc-meta";
                if (pr.repoKey && REPO_VIS[pr.repoKey]) {
                    const pill = document.createElement("span");
                    pill.className = "disc-pill";
                    pill.textContent = REPO_VIS[pr.repoKey].short;
                    meta.appendChild(pill);
                }
                const rel = document.createElement("span");
                rel.className = "disc-pill";
                rel.textContent = pr.relation === "review_requested" ? "Review requested" : "Authored";
                meta.appendChild(rel);
                if (pr.isDraft) {
                    const d = document.createElement("span");
                    d.className = "disc-pill";
                    d.textContent = "Draft";
                    meta.appendChild(d);
                }
                const tag = document.createElement("span");
                tag.className = "disc-pill";
                tag.textContent = "Not tracked yet";
                meta.appendChild(tag);
                card.appendChild(meta);
                attachSelectForPr(pr, card);
                cards.appendChild(card);
            });

            const cloudVisible = [];
            cloud.forEach((agent) => {
                const untracked = untrackedCloud.has(agent.agentId);
                if (!untracked && agent.runStatus !== "running") {
                    return;
                }
                cloudVisible.push({ agent, untracked });
            });

            cloudVisible.slice(0, RECONCILE_CARD_CAP).forEach(({ agent, untracked }) => {
                const card = document.createElement("article");
                card.className = "disc-card" + (untracked ? " untracked" : "");
                const title = document.createElement("p");
                title.className = "disc-title";
                const a = document.createElement("a");
                a.href = "#";
                a.textContent = "☁ " + (agent.name || agent.agentId);
                a.addEventListener("click", (ev) => {
                    ev.preventDefault();
                    openExternalUrl(agent.url);
                });
                title.appendChild(a);
                card.appendChild(title);
                const meta = document.createElement("div");
                meta.className = "disc-meta";
                if (agent.runStatus === "running") {
                    const run = document.createElement("span");
                    run.className = "disc-pill running";
                    run.textContent = "Running";
                    meta.appendChild(run);
                } else if (agent.runStatus) {
                    const st = document.createElement("span");
                    st.className = "disc-pill";
                    st.textContent = agent.runStatus;
                    meta.appendChild(st);
                }
                if (agent.branch) {
                    const br = document.createElement("span");
                    br.className = "disc-pill";
                    br.textContent = agent.branch;
                    meta.appendChild(br);
                }
                if (untracked) {
                    const tag = document.createElement("span");
                    tag.className = "disc-pill";
                    tag.textContent = "Not tracked yet";
                    meta.appendChild(tag);
                }
                card.appendChild(meta);
                if (untracked) {
                    const actions = document.createElement("div");
                    actions.className = "disc-actions";
                    actions.appendChild(discActionBtn("Dismiss", () => {
                        vscode.postMessage({ type: "reconcileDismiss", kind: "cloud", refKey: agent.agentId });
                    }));
                    card.appendChild(actions);
                }
                cards.appendChild(card);
            });

            const hiddenReconcile =
                Math.max(0, stale.length - RECONCILE_CARD_CAP) +
                Math.max(0, missing.length - RECONCILE_CARD_CAP) +
                Math.max(0, cloudVisible.length - RECONCILE_CARD_CAP) +
                Math.max(0, structural.length - RECONCILE_CARD_CAP);
            if (hiddenReconcile > 0) {
                const more = document.createElement("p");
                more.className = "disc-hint";
                more.textContent =
                    "+" + hiddenReconcile + " more items — refresh scan or open GitHub to review.";
                cards.appendChild(more);
            }

            if (cards.childElementCount) {
                details.appendChild(cards);
            }
            wrap.appendChild(details);
            root.appendChild(wrap);
        }

        function renderOpen(root, openTodos) {
            if (groupMode === "repo") {
                groupByRepo(root, openTodos);
            } else if (groupMode === "status") {
                groupByStatus(root, openTodos);
            } else {
                root.appendChild(listSection("Open", openTodos, null));
            }
        }

        function renderRepoSummary(openTodos) {
            const wrap = document.getElementById("repoSummary");
            wrap.replaceChildren();
            const counts = {};
            openTodos.forEach((t) => {
                const k = repoKey(t.repo) || "unknown";
                counts[k] = (counts[k] || 0) + 1;
            });
            REPO_ORDER.forEach((key) => {
                if (!counts[key]) return;
                const chipEl = document.createElement("span");
                chipEl.className = "rs-chip";
                const dot = document.createElement("span");
                dot.className = "dot";
                dot.style.background = REPO_VIS[key].accent;
                chipEl.appendChild(dot);
                chipEl.appendChild(document.createTextNode(REPO_VIS[key].name + " "));
                const cnt = document.createElement("span");
                cnt.className = "rs-count";
                cnt.textContent = String(counts[key]);
                chipEl.appendChild(cnt);
                wrap.appendChild(chipEl);
            });
        }

        function setFilter(next) {
            filter = next;
            saveUiState();
            document.querySelectorAll('.seg [data-filter]').forEach((btn) => {
                const on = btn.dataset.filter === filter;
                btn.classList.toggle("active", on);
                btn.setAttribute("aria-selected", on ? "true" : "false");
            });
            scheduleRender();
        }

        function setGroup(next) {
            groupMode = next;
            saveUiState();
            updateGroupToggleUi();
            scheduleRender();
        }

        function renderFootMeta(parts) {
            document.getElementById("footMeta").textContent = parts.join(" · ");
        }

        function renderPanelNotice() {
            const el = document.getElementById("panelNotice");
            const notice = boot.notice || (boot.loadError
                ? { level: "error", title: "Database unavailable", detail: boot.loadError, action: "retry" }
                : null);
            if (!notice) {
                el.classList.add("hidden");
                el.replaceChildren();
                return;
            }
            el.classList.remove("hidden");
            el.classList.toggle("warn", notice.level === "warn");
            el.replaceChildren();
            const title = document.createElement("strong");
            title.textContent = notice.title || "Something went wrong";
            el.appendChild(title);
            if (notice.detail) {
                const detail = document.createElement("div");
                detail.className = "panel-notice-detail";
                detail.textContent = notice.detail;
                el.appendChild(detail);
            }
            const actions = document.createElement("div");
            actions.className = "panel-notice-actions";
            if (notice.action === "retry" || notice.action === "sync") {
                const retry = document.createElement("button");
                retry.type = "button";
                retry.textContent = notice.action === "sync" ? "Sync again" : "Retry";
                retry.addEventListener("click", () => {
                    if (notice.action === "sync") {
                        vscode.postMessage({ type: "resyncDatabase" });
                    } else {
                        vscode.postMessage({ type: "refresh" });
                    }
                    document.getElementById("reloadBtn").classList.add("spinning");
                });
                actions.appendChild(retry);
            }
            if (notice.action === "openDb" || boot.loadError) {
                const db = document.createElement("button");
                db.type = "button";
                db.textContent = "Open database";
                db.addEventListener("click", () => vscode.postMessage({ type: "openDatabase" }));
                actions.appendChild(db);
            }
            const dismiss = document.createElement("button");
            dismiss.type = "button";
            dismiss.textContent = "Dismiss";
            dismiss.addEventListener("click", () => vscode.postMessage({ type: "dismissNotice" }));
            actions.appendChild(dismiss);
            el.appendChild(actions);
        }

        function renderNow() {
            renderPanelNotice();
            const activeTasks = boot.activeTasks || {};
            const serverTodos = activeTasks.todos || [];
            if (boot.loadError) {
                document.getElementById("emptyLoadError").classList.add("hidden");
            } else {
                document.getElementById("emptyLoadError").classList.add("hidden");
            }
            if (activeTasks.source) {
                const pathEl = document.getElementById("emptyDbPath");
                pathEl.textContent = "Source: " + activeTasks.source;
            }
            if (
                workspaceOnly &&
                serverTodos.filter((t) => !t.done).length > 0 &&
                serverTodos.filter((t) => !t.done && taskAppliesToWorkspaceContext(t)).length === 0
            ) {
                workspaceOnly = false;
                saveUiState();
            }
            let todos = serverTodos;
            const q = searchText.trim().toLowerCase();
            if (q) {
                todos = todos.filter((t) => todoMatchesSearch(t, q));
            }
            if (workspaceOnly) {
                todos = todos.filter(todoMatchesWorkspace);
            }
            const baseOpenTodos = todos.filter((t) => !t.done);
            let openTodos = applyPillFilter(baseOpenTodos);
            const doneTodos = todos.filter((t) => t.done);
            const doneCount = doneTodos.length;
            const total = todos.length;
            const open = openTodos.length;
            const pct = total ? Math.round((doneCount / total) * 100) : 0;

            const openCountEl = document.getElementById("openCount");
            if (awaitingPayload && !boot.generatedAt) {
                openCountEl.textContent = "—";
                openCountEl.classList.add("loading");
            } else {
                awaitingPayload = false;
                openCountEl.classList.remove("loading");
                openCountEl.textContent = total ? String(open) : "—";
            }
            document.getElementById("statsSub").textContent = total
                ? doneCount + " done · " + total + " total"
                : "Waiting for tasks";

            const barFill = document.getElementById("statsBarFill");
            if (barFill) {
                barFill.style.width = (total ? pct : 0) + "%";
            }

            renderRepoSummary(openTodos);
            renderFilterPills(baseOpenTodos);

            const empty = document.getElementById("emptyHint");
            const root = document.getElementById("sectionsRoot");
            root.replaceChildren();
            root.classList.toggle("grouped", groupMode !== "list");

            renderDiscovery(root);

            const filterLabel = activeViewFilterLabel();
            const filteredOut =
                filter === "open" &&
                !openTodos.length &&
                baseOpenTodos.length > 0;

            if (!total) {
                empty.classList.add("hidden");
                if (q || (filterLabel && filter !== "done")) {
                    renderFilteredEmpty(root, filterLabel || "search");
                } else if (!q) {
                    const disc = boot.discovery || {};
                    const hasDisc =
                        (disc.missingPrs && disc.missingPrs.length) ||
                        (disc.cloudAgents && disc.cloudAgents.length);
                    if (!hasDisc) {
                        empty.classList.remove("hidden");
                        document.getElementById("emptyDbPath").classList.remove("hidden");
                    }
                }
                const disc = boot.discovery || {};
                const footParts = [];
                if (disc.scannedAt) footParts.push("Scan " + shortAt(disc.scannedAt));
                footParts.push("Refreshed " + shortAt(boot.generatedAt));
                renderFootMeta(footParts);
                return;
            }
            empty.classList.add("hidden");

            const showReconcileFirst = pillFilter === "needsReconcile" && reconcileItemCount() > 0;

            if (filter === "open") {
                if (openTodos.length) {
                    renderOpen(root, openTodos);
                } else if (filteredOut && filterLabel) {
                    renderFilteredEmpty(root, filterLabel);
                } else if (showReconcileFirst) {
                    const hint = document.createElement("div");
                    hint.className = "empty";
                    hint.innerHTML = "<strong>Reconcile inbound PRs</strong> Attach or add rows in the section above.";
                    root.appendChild(hint);
                } else if (q && !baseOpenTodos.length) {
                    renderFilteredEmpty(root, "search");
                } else {
                    const hint = document.createElement("div");
                    hint.className = "empty";
                    hint.innerHTML = "<strong>Inbox zero</strong> All tasks complete.";
                    root.appendChild(hint);
                }
            } else if (filter === "all") {
                if (openTodos.length) renderOpen(root, openTodos);
                if (doneTodos.length) root.appendChild(listSection("Done", doneTodos, "var(--border)"));
            } else if (doneTodos.length) {
                root.appendChild(listSection("Done", doneTodos, "var(--border)"));
            } else {
                const hint = document.createElement("div");
                hint.className = "empty";
                hint.innerHTML = "<strong>Nothing done yet</strong> Complete a task to see it here.";
                root.appendChild(hint);
            }

            const footParts = [];
            if (groupMode === "list") footParts.push("Drag ⠿ to reorder");
            if (activeTasks.updatedAt) {
                footParts.push("Snapshot " + shortAt(activeTasks.updatedAt));
            } else if (activeTasks.source) {
                footParts.push("SQLite active work");
            }
            const disc = boot.discovery || {};
            if (disc.scannedAt) footParts.push("Scan " + shortAt(disc.scannedAt));
            footParts.push("Refreshed " + shortAt(boot.generatedAt));
            renderFootMeta(footParts);

            if (kbdFocusId) {
                const focused = document.querySelector(
                    '.task-card[data-id="' + CSS.escape(kbdFocusId) + '"]'
                );
                if (focused) {
                    focused.classList.add("kbd-focus");
                } else {
                    kbdFocusId = null;
                }
            }
        }

        document.getElementById("quickAddTitle").addEventListener("input", (ev) => {
            const form = document.getElementById("quickAddForm");
            form.classList.toggle("has-text", Boolean(ev.target.value.trim()));
        });

        document.getElementById("quickAddForm").addEventListener("submit", (ev) => {
            ev.preventDefault();
            const titleEl = document.getElementById("quickAddTitle");
            const statusEl = document.getElementById("quickAddStatus");
            const title = titleEl.value.trim();
            if (!title) return;
            vscode.postMessage({
                type: "quickAddWork",
                title,
                status: statusEl.value,
            });
            titleEl.value = "";
            titleEl.focus();
            document.getElementById("quickAddForm").classList.remove("has-text");
        });

        document.getElementById("emptyReconcileBtn").onclick = () => {
            invalidateAndRefresh();
        };
        document.getElementById("emptyDbBtn").onclick = () => vscode.postMessage({ type: "openDatabase" });
        document.getElementById("emptySyncBtn").onclick = () => {
            vscode.postMessage({ type: "resyncDatabase" });
            document.getElementById("reloadBtn").classList.add("spinning");
        };

        function invalidateAndRefresh() {
            document.getElementById("reloadBtn").classList.add("spinning");
            vscode.postMessage({ type: "refresh" });
        }

        document.getElementById("taskSearch").addEventListener("input", (ev) => {
            searchText = ev.target.value;
            document
                .getElementById("taskSearchClear")
                .classList.toggle("hidden", !searchText.trim());
            if (searchDebounce) {
                clearTimeout(searchDebounce);
            }
            searchDebounce = setTimeout(() => {
                searchDebounce = null;
                scheduleRender();
            }, 150);
        });
        document.getElementById("taskSearchClear").addEventListener("click", () => {
            searchText = "";
            document.getElementById("taskSearch").value = "";
            document.getElementById("taskSearchClear").classList.add("hidden");
            document.getElementById("taskSearch").focus();
            scheduleRender();
        });

        document.querySelectorAll('.seg [data-filter]').forEach((btn) => {
            btn.addEventListener("click", () => setFilter(btn.dataset.filter || "open"));
            const on = btn.dataset.filter === filter;
            btn.classList.toggle("active", on);
            btn.setAttribute("aria-selected", on ? "true" : "false");
        });
        document.getElementById("groupToggle").addEventListener("click", () => cycleGroupMode());
        updateGroupToggleUi();

        document.getElementById("reloadBtn").onclick = () => invalidateAndRefresh();
        document.getElementById("popOutBtn").onclick = () => vscode.postMessage({ type: "popOut" });
        document.getElementById("dbBtn").onclick = () => vscode.postMessage({ type: "openDatabase" });

        function finishDone(mode) {
            if (doneModalTodoId) {
                vscode.postMessage({ type: "setDoneMode", id: doneModalTodoId, mode });
            }
            hideDoneModal();
        }
        document.getElementById("doneSessionBtn").onclick = () => finishDone("session");
        document.getElementById("doneArchiveBtn").onclick = () => finishDone("archive");
        document.getElementById("doneRemoveBtn").onclick = () => finishDone("remove");
        document.getElementById("doneUndoBtn").onclick = () => hideDoneModal();
        document.getElementById("doneModal").addEventListener("click", (ev) => {
            if (ev.target.id === "doneModal") hideDoneModal();
        });
        document.addEventListener("keydown", (ev) => {
            if (ev.key === "Escape" && doneModalTodoId) {
                hideDoneModal();
                return;
            }
            if (doneModalTodoId) return;
            const tag = (ev.target && ev.target.tagName) || "";
            if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;

            const cards = visibleTaskCards();
            if (!cards.length) return;

            if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
                ev.preventDefault();
                let idx = cards.findIndex((c) => c.dataset.id === kbdFocusId);
                if (idx < 0) idx = 0;
                else idx += ev.key === "ArrowDown" ? 1 : -1;
                idx = Math.max(0, Math.min(cards.length - 1, idx));
                const nextId = cards[idx].dataset.id;
                setKbdFocus(nextId);
                cards[idx].focus();
                cards[idx].scrollIntoView({ block: "nearest" });
                return;
            }

            if (!kbdFocusId) return;
            const todo = cardTodoById(kbdFocusId);
            if (!todo) return;
            if (ev.key === "Enter") {
                ev.preventDefault();
                toggleExpanded(todo.id);
            } else if (ev.key === " " || ev.key === "x" || ev.key === "X") {
                ev.preventDefault();
                triggerDoneForTodo(todo);
            }
        });
        window.addEventListener("message", (e) => {
            if (e.data && e.data.type === "update") {
                boot = e.data.payload;
                document.getElementById("reloadBtn").classList.remove("spinning");
                vscode.setState({ ...(vscode.getState() || {}), hasRendered: true });
                scheduleRender();
            }
        });
        scheduleRender();
    </script>
</body>

</html>
