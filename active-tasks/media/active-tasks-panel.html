            btn.textContent = "Clear filters";
            btn.addEventListener("click", () => {
                searchText = "";
                document.getElementById("taskSearch").value = "";
                document.getElementById("taskSearchClear").classList.add("hidden");
                workspaceOnly = false;
                pillFilter = "allOpen";
                saveUiState();
                scheduleRender();
            });
            actions.appendChild(btn);
            hint.appendChild(actions);
            root.appendChild(hint);
        }

        function applyPillFilter(todos) {
            if (pillFilter === "hasPr") {
                return todos.filter((t) => todoHasPr(t));
            }
            if (pillFilter === "inReview") {
                return todos.filter((t) => statusToneForTodo(t) === "review");
            }
            if (pillFilter === "blocked") {
                return todos.filter((t) => statusToneForTodo(t) === "blocked");
            }
            return todos;
        }

        const PILL_DEFS = [
            { id: "allOpen", label: "All open" },
            { id: "hasPr", label: "Has PR" },
            { id: "inReview", label: "In review" },
            { id: "blocked", label: "Blocked" },
            { id: "workspace", label: "This workspace" },
        ];

        let lastPillSignature = "";

        function renderFilterPills(openTodos) {
            const root = document.getElementById("filterPills");
            const wsOpen = (boot.activeTasks.todos || []).filter((t) => !t.done && todoMatchesWorkspace(t)).length;
            const hasPr = openTodos.filter((t) => todoHasPr(t)).length;
            const signature = [
                openTodos.length,
                hasPr,
                wsOpen,
                pillFilter,
                workspaceOnly ? 1 : 0,
                hideNested ? 1 : 0,
            ].join("|");
            if (signature === lastPillSignature && root.childElementCount > 0) {
                updateHideNestedUi();
                return;
            }
            lastPillSignature = signature;
            root.replaceChildren();

            const hideBtn = document.createElement("button");
            hideBtn.type = "button";
            hideBtn.className = "pill hide-nested";
            hideBtn.id = "hideNestedBtn";
            hideBtn.setAttribute("role", "switch");
            hideBtn.textContent = "Hide nested";
            hideBtn.addEventListener("click", () => setHideNested(!hideNested));
            root.appendChild(hideBtn);
            const sep = document.createElement("span");
            sep.className = "pill hide-nested-sep";
            sep.setAttribute("aria-hidden", "true");
            root.appendChild(sep);
            updateHideNestedUi();

            PILL_DEFS.forEach((def) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "pill";
                btn.dataset.pill = def.id;
                btn.setAttribute("role", "tab");
                const active =
                    def.id === "workspace" ? workspaceOnly : pillFilter === def.id && def.id !== "workspace";
                if (active) btn.classList.add("active");
                btn.setAttribute("aria-selected", active ? "true" : "false");
                btn.appendChild(document.createTextNode(def.label));
                let count = null;
                if (def.id === "allOpen") count = openTodos.length;
                else if (def.id === "hasPr") count = hasPr;
                else if (def.id === "workspace") count = wsOpen;
                if (count != null) {
                    const c = document.createElement("span");
                    c.className = "pill-count";
                    c.textContent = String(count);
                    btn.appendChild(c);
                }
                btn.addEventListener("click", () => setPillFilter(def.id));
                root.appendChild(btn);
            });
        }

        function setPillFilter(id) {
            if (id === "workspace") {
                workspaceOnly = !workspaceOnly;
            } else {
                pillFilter = id;
            }
            saveUiState();
            scheduleRender();
        }

        function primaryHref(todo) {
            if (todo.pr_url) return todo.pr_url;
            if (todo.pr_number && todo.repo) {
                const u = githubPrUrl(todo.repo, todo.pr_number);
                if (u) return u;
            }
            if (todo.links && todo.links.length) return todo.links[0].url;
            return null;
        }

        function saveUiState(extra) {
            vscode.setState({
                ...(vscode.getState() || {}),
                filter,
                groupMode,
                viewMode,
                pillFilter,
                expandedId,
                workspaceOnly,
                hideNested,
                collapsedNestIds: [...collapsedNestIds],
                ...extra,
            });
        }

        function openExternalUrl(url, ev) {
            if (ev) {
                ev.preventDefault();
                ev.stopPropagation();
            }
            if (url) vscode.postMessage({ type: "openUrl", url });
        }

        function wireExternalAnchor(a) {
            const href = a.getAttribute("href");
            if (!href || !/^https?:/i.test(href)) return;
            a.addEventListener("click", (ev) => openExternalUrl(href, ev));
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); } catch (e) { /* noop */ }
            document.body.removeChild(ta);
        }

        function chip(cls, text) {
            const el = document.createElement("span");
            el.className = "todo-chip " + cls;
            if (text != null) el.textContent = text;
            return el;
        }

        // Mirrors planPathFromUrl in the host. The host re-validates before
        // opening anything, so this only decides how the chip renders.
        function isPlanUrl(url) {
            if (typeof url !== "string") return false;
            const u = url.trim();
            if (!u.endsWith(".plan.md")) return false;
            return u.startsWith("~/.cursor/plans/") || u.includes("/.cursor/plans/");
        }

        function gitProbeLabel(gs) {
            if (!gs.exists) return "wt missing";
            if (gs.error) return "git ?";
            const bits = [];
            if (gs.dirtyCount > 0) bits.push(gs.dirtyCount + " dirty");
            if (gs.ahead > 0) bits.push("↑" + gs.ahead);
            if (gs.behind > 0) bits.push("↓" + gs.behind);
            return bits.length ? bits.join(" ") : "clean";
        }

        function gitProbeTitle(gs) {
            if (!gs.exists) return "Worktree path does not exist: " + gs.path;
            if (gs.error) return gs.error;
            const branch = gs.detached ? "detached" : (gs.branch || "unknown branch");
            const last = gs.lastCommitIso ? " · last commit " + gs.lastCommitIso.slice(0, 10) : "";
            return branch + " · " + gs.dirtyCount + " changed · ahead " + gs.ahead + " behind " + gs.behind + last;
        }

        function buildMeta(todo, opts) {
            const meta = document.createElement("div");
            meta.className = "todo-meta";

            if (todo.branch) {
                const c = chip("branch", todo.branch);
                c.title = "Click to copy branch";
                c.addEventListener("click", (ev) => {
                    ev.stopPropagation();
                    copyToClipboard(todo.branch);
                    const prev = c.textContent;
                    c.classList.add("copied");
                    c.textContent = "✓ copied";
                    setTimeout(() => { c.classList.remove("copied"); c.textContent = prev; }, 1100);
                });
                meta.appendChild(c);
            }
            if (todo.worktree) {
                const c = chip("worktree", "wt: " + todo.worktree);
                c.title = "Click to copy worktree path";
                c.addEventListener("click", (ev) => {
                    ev.stopPropagation();
                    copyToClipboard(todo.worktree);
                    const prev = c.textContent;
                    c.classList.add("copied");
                    c.textContent = "✓ copied";
                    setTimeout(() => { c.classList.remove("copied"); c.textContent = prev; }, 1100);
                });
                meta.appendChild(c);
            }
            (todo.prs || []).forEach((pr) => {
                const prk = repoKey(pr.repo);
                const c = chip("pr" + (prk ? " repo-" + prk : ""));
                const a = document.createElement("a");
                a.href = pr.url;
                a.textContent = (pr.repo ? REPO_VIS[prk] ? REPO_VIS[prk].short + " " : pr.repo + " " : "") + "#" + pr.number;
                a.title = "Open PR #" + pr.number;
                wireExternalAnchor(a);
                c.appendChild(a);
                meta.appendChild(c);
            });
            const gs = (boot.discovery && boot.discovery.gitStatusByTodoId || {})[todo.id];
            if (gs) {
                const c = chip("git", gitProbeLabel(gs));
                c.title = gitProbeTitle(gs);
                if (!gs.exists || gs.error) c.classList.add("bad");
                else if (gs.dirtyCount > 0 || gs.behind > 0) c.classList.add("warn");
                meta.appendChild(c);
            }
            (todo.links || []).forEach((link) => {
                if (isPlanUrl(link.url)) {
                    const c = chip("plan", "plan");
                    c.title = "Open " + link.url;
                    c.addEventListener("click", (ev) => {
                        ev.stopPropagation();
                        vscode.postMessage({ type: "openPlan", path: link.url });
                    });
                    meta.appendChild(c);
                    return;
                }
                const c = chip("link");
                const a = document.createElement("a");
                a.href = link.url;
                a.textContent = link.label;
                a.title = link.url;
                wireExternalAnchor(a);
                c.appendChild(a);
                meta.appendChild(c);
            });
            if (todo.waiting_on) {
                meta.appendChild(chip("branch", "⏳ " + todo.waiting_on));
            }
            const visibleCap = opts && opts.cap != null ? opts.cap : 3;
            if (meta.childNodes.length > visibleCap) {
                const chips = [...meta.children];
                const overflow = document.createElement("span");
                overflow.className = "meta-overflow hidden";
                chips.slice(visibleCap).forEach((node) => overflow.appendChild(node));
                meta.replaceChildren(...chips.slice(0, visibleCap), overflow);
                const extra = chips.length - visibleCap;
                const more = chip("meta-more", "+" + extra);
                more.title = "Show " + extra + " more fields";
                more.addEventListener("click", (ev) => {
                    ev.stopPropagation();
                    overflow.classList.toggle("hidden");
                    more.classList.toggle("open");
                });
                meta.appendChild(more);
            }
            return meta.childNodes.length ? meta : null;
        }

        function toggleExpanded(todoId) {
            expandedId = expandedId === todoId ? null : todoId;
            saveUiState();
            scheduleRender();
        }

        function fieldInput(label, value, opts) {
            const wrap = document.createElement("label");
            wrap.textContent = label;
            let control;
            if (opts && opts.type === "textarea") {
                control = document.createElement("textarea");
                control.value = value || "";
            } else if (opts && opts.type === "select") {
                control = document.createElement("select");
                const want = String(value ?? "");
                (opts.options || []).forEach(([val, text]) => {
                    const o = document.createElement("option");
                    o.value = val;
                    o.textContent = text;
                    if (
                        val === want ||
                        (opts.matchStatusLabel &&
                            val.toLowerCase() === want.toLowerCase())
                    ) {
                        o.selected = true;
                    }
                    control.appendChild(o);
                });
            } else if (opts && opts.type === "number") {
                control = document.createElement("input");
                control.type = "number";
                control.value = value != null && value !== "" ? String(value) : "";
                if (opts.min != null) control.min = String(opts.min);
                if (opts.max != null) control.max = String(opts.max);
            } else if (opts && opts.type === "checkbox") {
                control = document.createElement("input");
                control.type = "checkbox";
                control.checked = Boolean(value);
            } else if (opts && opts.type === "date") {
                control = document.createElement("input");
                control.type = "date";
                control.value = value ? String(value).slice(0, 10) : "";
            } else {
                control = document.createElement("input");
                control.type = "text";
                control.value = value || "";
            }
            control.dataset.field = opts.field;
            if (opts && opts.block) wrap.classList.add("field-block");
            wrap.appendChild(control);
            return wrap;
        }

        function propGroup(label, opts) {
            const collapsible = Boolean(opts && opts.collapsible);
            const grid = document.createElement("div");
            grid.className = "field-grid";
            let wrap;
            if (collapsible) {
                wrap = document.createElement("details");
                wrap.className = "task-page-group";
                if (opts && opts.open) wrap.open = true;
                const summary = document.createElement("summary");
                summary.textContent = label;
                wrap.appendChild(summary);
            } else {
                wrap = document.createElement("div");
                wrap.className = "task-page-group";
                if (label) {
                    const l = document.createElement("span");
                    l.className = "group-label";
                    l.textContent = label;
                    wrap.appendChild(l);
                }
            }
            wrap.appendChild(grid);
            wrap.__grid = grid;
            return wrap;
        }

        function normalizeTagInput(raw) {
            const t = String(raw || "")
                .trim()
                .replace(/\s+/g, " ");
            if (!t || t.length > 64) return null;
            return t;
        }

        function buildTagFieldEditor(todo, vocab) {
            const wrap = document.createElement("div");
            wrap.className = "tag-field-editor";
            const label = document.createElement("span");
            label.className = "field-label";
            label.textContent = "Tags";
            wrap.appendChild(label);

            const selected = new Set();
            (todo.tags || []).forEach((t) => {
                const n = normalizeTagInput(t);
                if (n) selected.add(n);
            });

            const chipRow = document.createElement("div");
            chipRow.className = "tag-selected-row";
            const optionRow = document.createElement("div");
            optionRow.className = "tag-option-row";

            function allVocab() {
                const merged = new Set(vocab || []);
                selected.forEach((t) => merged.add(t));
                return [...merged].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
            }

            function renderSelected() {
                chipRow.replaceChildren();
                if (!selected.size) {
                    const empty = document.createElement("span");
                    empty.className = "disc-hint";
                    empty.textContent = "No tags — pick below or add new.";
                    chipRow.appendChild(empty);
                    return;
                }
                selected.forEach((tag) => {
                    const chip = createTagChip(tag, { button: true, label: tag + " ×" });
                    chip.classList.add("on");
                    chip.title = "Remove tag";
                    chip.addEventListener("click", (ev) => {
                        ev.stopPropagation();
                        selected.delete(tag);
                        renderSelected();
                        renderOptions();
                    });
                    chipRow.appendChild(chip);
                });
            }

            function renderOptions() {
                optionRow.replaceChildren();
                allVocab().forEach((tag) => {
                    if (selected.has(tag)) return;
                    const btn = createTagChip(tag, { button: true, label: "+ " + tag });
                    btn.addEventListener("click", (ev) => {
                        ev.stopPropagation();
                        selected.add(tag);
                        renderSelected();
                        renderOptions();
                    });
                    optionRow.appendChild(btn);
                });
            }

            const addRow = document.createElement("div");
            addRow.className = "tag-add-row";
            const inp = document.createElement("input");
            inp.type = "text";
            inp.placeholder = "New tag…";
            inp.setAttribute("aria-label", "New tag name");
            const addBtn = document.createElement("button");
            addBtn.type = "button";
            addBtn.textContent = "Add tag";
            function commitNew() {
                const n = normalizeTagInput(inp.value);
                if (!n) return;
                selected.add(n);
                inp.value = "";
                renderSelected();
                renderOptions();
            }
            addBtn.addEventListener("click", (ev) => {
                ev.stopPropagation();
                commitNew();
            });
            inp.addEventListener("keydown", (ev) => {
                if (ev.key === "Enter") {
                    ev.preventDefault();
                    ev.stopPropagation();
                    commitNew();
                }
            });
            addRow.appendChild(inp);
            addRow.appendChild(addBtn);

            wrap.appendChild(chipRow);
            wrap.appendChild(optionRow);
            wrap.appendChild(addRow);
            wrap.__getTags = () => [...selected];
            renderSelected();
            renderOptions();
            return wrap;
        }

        function postMergeWorkRows(primaryId, mergeIds) {
            if (!primaryId || !mergeIds.length) return;
            expandedId = primaryId;
            saveUiState();
            vscode.postMessage({
                type: "mergeWorkRows",
                primaryId,
                mergeIds,
            });
        }

        function buildMergeIntoSection(todo) {
            const wrap = document.createElement("div");
            wrap.className = "merge-into-panel";
            const label = document.createElement("span");
            label.className = "field-label";
            label.textContent = "Nest under this task";
            wrap.appendChild(label);
            const hint = document.createElement("p");
            hint.className = "disc-hint";
            hint.style.margin = "0 0 .4rem";
            hint.textContent =
                "Selected rows become subtasks here (nested under this card). Rows are not deleted.";
            wrap.appendChild(hint);

            const others = (boot.activeTasks.todos || []).filter(
                (t) => !t.done && t.id !== todo.id
            );
            if (!others.length) {
                const empty = document.createElement("p");
                empty.className = "disc-hint";
                empty.textContent = "No other open tasks to merge.";
                wrap.appendChild(empty);
                return wrap;
            }

            const list = document.createElement("div");
            list.className = "merge-candidate-list";
            others.forEach((t) => {
                const row = document.createElement("label");
                row.className = "merge-candidate";
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.value = t.id;
                cb.dataset.mergeSource = "1";
                row.appendChild(cb);
                const text = document.createElement("span");
                text.textContent = (t.title || t.label || "Untitled") +
                    (t.repo ? " · " + t.repo : "");
                row.appendChild(text);
                list.appendChild(row);
            });
            wrap.appendChild(list);

            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "primary";
            btn.textContent = "Nest selected under this row";
            btn.addEventListener("click", (ev) => {
                ev.stopPropagation();
                const mergeIds = [...list.querySelectorAll("input[type=checkbox]:checked")]
                    .map((el) => el.value)
                    .filter(Boolean);
                if (!mergeIds.length) return;
                const titles = mergeIds
                    .map((id) => others.find((t) => t.id === id))
                    .filter(Boolean)
                    .map((t) => t.title || t.label)
                    .join(", ");
                const ok = window.confirm(
                    "Nest " +
                    mergeIds.length +
                    " task(s) under \"" +
                    (todo.title || todo.label) +
                    "\"?\n\n" +
                    titles
                );
                if (!ok) return;
                postMergeWorkRows(todo.id, mergeIds);
            });
            wrap.appendChild(btn);
            return wrap;
        }

        function taskPageChipRow(todo) {
            const row = document.createElement("div");
            row.className = "task-page-chips";
            if (!todo.done) {
                const tone = statusToneForTodo(todo);
                const pill = document.createElement("span");
                pill.className = "status-pill tone-" + tone;
                pill.textContent = statusKeyDisplayLabel(todo);
                pill.title = todo.status || statusKeyDisplayLabel(todo);
                row.appendChild(pill);
            }
            const ci = ciPillForTodo(todo);
            if (ci) row.appendChild(ci);
            const pr = primaryPrLinkChip(todo);
            if (pr) row.appendChild(pr);
            const meta = buildMeta(todo, { cap: Infinity });
            if (meta) [...meta.children].forEach((node) => row.appendChild(node));
            return row.childNodes.length ? row : null;
        }

        function buildExpandPanel(todo) {
            const panel = document.createElement("div");
            panel.className = "task-expand-panel";
            const page = document.createElement("div");
            page.className = "task-page";

            // Every control stays inside `fields` — the save handler enumerates
            // [data-field] from here, so a control rendered outside it would
            // silently stop persisting.
            const fields = document.createElement("div");
            fields.className = "task-page-fields";

            const head = document.createElement("div");
            head.className = "task-page-head";
            const titleInput = document.createElement("input");
            titleInput.type = "text";
            titleInput.className = "task-page-title";
            titleInput.value = todo.title || todo.label || "";
            titleInput.placeholder = "Untitled";
            titleInput.dataset.field = "title";
            titleInput.setAttribute("aria-label", "Task title");
            head.appendChild(titleInput);
            const chips = taskPageChipRow(todo);
            if (chips) head.appendChild(chips);
            fields.appendChild(head);

            const main = propGroup("");
            main.__grid.appendChild(fieldInput("Status", todo.status, {
                field: "status",
                type: "select",
                matchStatusLabel: true,
                options: statusLabelSelectOptions(todo.status),
            }));
            // Also the click-to-move fallback for the board: same write path as
            // dragging a card into another column.
            main.__grid.appendChild(fieldInput("Bucket", todo.status_key, {
                field: "status_key",
                type: "select",
                options: STATUS_KEY_OPTIONS,
            }));
            main.__grid.appendChild(fieldInput("Next action", todo.next_action, { field: "next_action" }));
            main.__grid.appendChild(fieldInput("Priority", todo.priority != null ? todo.priority : 1, {
                field: "priority",
                type: "number",
                min: 0,
                max: 3,
            }));
            main.__grid.appendChild(fieldInput("Pinned", todo.pinned, { field: "pinned", type: "checkbox" }));
            main.__grid.appendChild(fieldInput("Due", todo.due, { field: "due", type: "date" }));
            main.__grid.appendChild(fieldInput("Waiting on", todo.waiting_on, { field: "waiting_on" }));
            const blockerOpts = [["", "—"]];
            (boot.activeTasks.todos || []).filter((t) => !t.done && t.id !== todo.id).forEach((t) => {
                blockerOpts.push([t.id, (t.title || t.label || "Task").slice(0, 48)]);
            });
            main.__grid.appendChild(fieldInput("Blocked by", todo.blocked_by_id, {
                field: "blocked_by_id",
                type: "select",
                options: blockerOpts,
            }));
            fields.appendChild(main);

            const work = propGroup("Where the work lives");
            work.__grid.appendChild(fieldInput("Repo", todo.repo, {
                field: "repo",
                type: "select",
                options: [
                    ["", "—"],
                    ["instawork", "instawork"],
                    ["finch", "finch"],
                    ["infrastructure", "infrastructure"],
                    ["other", "other"],
                ],
            }));
            work.__grid.appendChild(fieldInput("Branch", todo.branch, { field: "branch" }));
            work.__grid.appendChild(fieldInput("Worktree", todo.worktree, { field: "worktree" }));
            work.__grid.appendChild(fieldInput("PR number", todo.pr_number, { field: "pr_number", type: "number" }));
            work.__grid.appendChild(fieldInput("PR URL", todo.pr_url, { field: "pr_url" }));
            fields.appendChild(work);

            // buildTagFieldEditor prints its own "Tags" label.
            const tagsGroup = propGroup("");
            const vocab = (boot.activeTasks && boot.activeTasks.tagVocab) || [];
            tagsGroup.__grid.appendChild(buildTagFieldEditor(todo, vocab));
            fields.appendChild(tagsGroup);

            const notesGroup = propGroup("");
            notesGroup.__grid.appendChild(fieldInput("Notes", todo.notes, {
                field: "notes",
                type: "textarea",
                block: true,
            }));
            fields.appendChild(notesGroup);

            const adv = propGroup("Advanced", { collapsible: true });
            adv.__grid.appendChild(fieldInput("Cloud agent id", todo.cloud_agent_id, { field: "cloud_agent_id" }));
            adv.__grid.appendChild(fieldInput("Source URL", todo.source_url, { field: "source_url" }));
            adv.__grid.appendChild(fieldInput("Stream source", todo.stream_source, {
                field: "stream_source",
                type: "select",
                options: [
                    ["", "—"],
                    ["manual", "manual"],
                    ["slack", "slack"],
                    ["spark_mail", "spark_mail"],
                    ["github", "github"],
                    ["asana", "asana"],
                ],
            }));
            adv.__grid.appendChild(fieldInput("Channel", todo.channel, { field: "channel" }));
            adv.__grid.appendChild(fieldInput("Extra PRs (JSON)", JSON.stringify(todo.prs || [], null, 2), {
                field: "prs_json",
                type: "textarea",
                block: true,
            }));
            adv.__grid.appendChild(fieldInput("Links (JSON)", JSON.stringify(todo.links || [], null, 2), {
                field: "links_json",
                type: "textarea",
                block: true,
            }));
            fields.appendChild(adv);

            page.appendChild(fields);

            const nest = propGroup("Nest other tasks here", { collapsible: true });
            nest.__grid.appendChild(buildMergeIntoSection(todo));
            page.appendChild(nest);

            const actions = document.createElement("div");
            actions.className = "expand-actions";
            const saveBtn = document.createElement("button");
            saveBtn.type = "button";
            saveBtn.className = "primary";
            saveBtn.textContent = "Save to database";
            saveBtn.addEventListener("click", (ev) => {
                ev.stopPropagation();
                const updates = {};
                fields.querySelectorAll("[data-field]").forEach((el) => {
                    const key = el.dataset.field;
                    if (!key) return;
                    if (key === "pr_number") {
                        const raw = el.value.trim();
                        updates.pr_number = raw ? parseInt(raw, 10) : null;
                        return;
                    }
                    if (key === "priority") {
                        const raw = el.value.trim();
                        updates.priority = raw === "" ? 1 : parseInt(raw, 10);
                        return;
                    }
                    if (key === "pinned") {
                        updates.pinned = el.checked;
                        return;
                    }
                    if (key === "blocked_by_id") {
                        updates.blocked_by_id = el.value.trim() || null;
                        return;
                    }
                    updates[key] = el.value;
                });
                const tagEditor = fields.querySelector(".tag-field-editor");
                if (tagEditor && typeof tagEditor.__getTags === "function") {
                    updates.tags = tagEditor.__getTags();
                }
                const archiveKey = updates.status_key;
                if (archiveKey === "done" || archiveKey === "wont_fix") {
                    delete updates.status_key;
                    if (Object.keys(updates).length) {
                        vscode.postMessage({ type: "updateTodo", id: todo.id, fields: updates });
                    }
                    markTodoDone(
                        todo.id,
                        archiveKey === "wont_fix" ? "wont_fix" : "manual"
                    );
                    return;
                }
                vscode.postMessage({ type: "updateTodo", id: todo.id, fields: updates });
                flashSaved(todo.id);
            });
            const collapseBtn = document.createElement("button");
            collapseBtn.type = "button";
            collapseBtn.textContent = "Collapse";
            collapseBtn.addEventListener("click", (ev) => {
                ev.stopPropagation();
                expandedId = null;
                saveUiState();
                scheduleRender();
            });
            if (todo.worktree) {
                const wtBtn = document.createElement("button");
                wtBtn.type = "button";
                wtBtn.textContent = "Open worktree";
                wtBtn.addEventListener("click", (ev) => {
                    ev.stopPropagation();
                    vscode.postMessage({ type: "openWorktree", path: todo.worktree });
                });
                actions.appendChild(wtBtn);
            }
            if (!todo.cloud_agent_id && REPO_VIS[repoKey(todo.repo)]) {
                const launchBtn = document.createElement("button");
                launchBtn.type = "button";
                launchBtn.textContent = "Launch agent";
                launchBtn.title = "Start a cloud subagent on this task's branch";
                launchBtn.addEventListener("click", (ev) => {
                    ev.stopPropagation();
                    launchBtn.disabled = true;
                    launchBtn.textContent = "Launching…";
                    vscode.postMessage({ type: "launchAgent", id: todo.id });
                });
                actions.appendChild(launchBtn);
            }
            const dbBtn = document.createElement("button");
            dbBtn.type = "button";
            dbBtn.textContent = "Open DB";
            dbBtn.addEventListener("click", (ev) => {
                ev.stopPropagation();
                vscode.postMessage({ type: "openDatabase" });
            });
            actions.appendChild(dbBtn);
            const href = primaryHref(todo);
            if (href) {
                const openBtn = document.createElement("button");
                openBtn.type = "button";
                openBtn.textContent = "Open PR";
                openBtn.addEventListener("click", (ev) => openExternalUrl(href, ev));
                actions.appendChild(openBtn);
            }
            actions.appendChild(saveBtn);
            actions.appendChild(collapseBtn);
            panel.appendChild(actions);
            panel.addEventListener("click", (ev) => ev.stopPropagation());
            return panel;
        }

        function showDoneModal(todo) {
            doneModalTodoId = todo.id;
            document.getElementById("doneModalBody").textContent =
                "How should we close \"" + (todo.title || todo.label || "Task") + "\"?";
            const modal = document.getElementById("doneModal");
            modal.classList.remove("hidden");
            const focusables = modal.querySelectorAll("button");
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (first) first.focus();
            if (doneModalTrap) {
                document.removeEventListener("keydown", doneModalTrap);
            }
            doneModalTrap = (ev) => {
                if (ev.key !== "Tab" || !doneModalTodoId) return;
                if (ev.shiftKey && document.activeElement === first) {
                    ev.preventDefault();
                    last.focus();
                } else if (!ev.shiftKey && document.activeElement === last) {
                    ev.preventDefault();
                    first.focus();
                }
            };
            document.addEventListener("keydown", doneModalTrap);
        }

        function hideDoneModal() {
            doneModalTodoId = null;
            document.getElementById("doneModal").classList.add("hidden");
            if (doneModalTrap) {
                document.removeEventListener("keydown", doneModalTrap);
                doneModalTrap = null;
            }
        }

        function flashSaved(todoId) {
            const card = cardElementById(todoId);
            if (!card) return;
            card.classList.add("saved");
            setTimeout(() => card.classList.remove("saved"), 900);
        }

        function autoGrow(el) {
            el.style.height = "auto";
            el.style.height = el.scrollHeight + "px";
        }

        function setEditableText(el, value, o) {
            const text = value == null ? "" : String(value);
            const shown = text || o.emptyLabel || "";
            el.dataset.value = text;
            el.textContent = shown;
            el.classList.toggle("is-empty", !text);
            // Truncated: notes can run for paragraphs, and the visible text is
            // clamped to two lines, so an untruncated name reads far longer than
            // anything on screen.
            const named = shown.length > 80 ? shown.slice(0, 80) + "…" : shown;
            el.setAttribute("aria-label", "Edit " + (o.label || "field") + ": " + named);
        }

        function applyLocalField(todoId, field, value) {
            const row = ((boot.activeTasks && boot.activeTasks.todos) || [])
                .find((t) => t.id === todoId);
            if (row) row[field] = value;
        }

        // Collapsed state stays a div so long text wraps and line-clamps the way
        // it always has; the textarea only exists while you are actually editing.
        // An <input> here would truncate wrapped titles in a narrow panel.
        function editableText(todo, field, value, opts) {
            const o = opts || {};
            const el = document.createElement("div");
            el.className = "editable" + (o.className ? " " + o.className : "");
            el.dataset.editField = field;
            // Deliberately a real tab stop and not roving like .task-card:
            // setKbdFocus() does not re-render, so a roving tabindex here goes
            // stale and leaves the field unreachable by keyboard entirely.
            el.tabIndex = 0;
            el.setAttribute("role", "button");
            if (o.hint) el.title = o.hint;
            setEditableText(el, value, o);
            const begin = (ev) => {
                ev.stopPropagation();
                beginInlineEdit(el, todo, field, o);
            };
            el.addEventListener("click", begin);
            el.addEventListener("keydown", (ev) => {
                if (ev.key !== "Enter" && ev.key !== " ") return;
                ev.preventDefault();
                begin(ev);
            });
            return el;
        }

        // Commits on blur and on Enter, reverts on Escape. Writes go through the
        // same updateTodo message the expand panel's Save button posts, so there
        // is one write path into the database rather than two.
        //
        // The read-state div is hidden rather than replaced: keeping it means the
        // tooltip and any wiring buildTaskCard added survive the round trip, and
        // there is a stable node to hand focus back to.
        function beginInlineEdit(el, todo, field, o) {
            if (!el.isConnected) return;
            const original = el.dataset.value || "";
            const ta = document.createElement("textarea");
            ta.className = "inline-edit" + (o.className ? " " + o.className : "");
            ta.value = original;
            ta.rows = 1;
            ta.spellcheck = false;
            if (o.placeholder) ta.placeholder = o.placeholder;
            ta.setAttribute("aria-label", o.label || field);

            el.style.display = "none";
            el.after(ta);
            // Never gate rendering on an edit that failed to mount: a stuck
            // inlineEditing would park every future render for good.
            if (!ta.isConnected) {
                el.style.display = "";
                return;
            }
            inlineEditing = todo.id;
            autoGrow(ta);
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);

            let settled = false;
            const finish = (commit, refocus) => {
                if (settled) return;
                settled = true;
                const next = ta.value.trim();
                // An empty title would leave a row with nothing to identify it by,
                // and the panel has no undo. Treat it as a cancel.
                const wipesTitle = field === "title" && !next;
                const changed = commit && next !== original && !wipesTitle;

                ta.remove();
                el.style.display = "";
                setEditableText(el, changed ? next : original, o);
                if (changed) {
                    // Keep the local payload in step so a render parked by this
                    // edit does not repaint the pre-edit value on the way out.
                    applyLocalField(todo.id, field, next);
                    // The expand panel snapshots its inputs when it is built, so
                    // an open panel still holds the pre-edit value — its Save
                    // button would post that stale value straight back.
                    syncExpandPanelField(el, field, next);
                    vscode.postMessage({
                        type: "updateTodo",
                        id: todo.id,
                        fields: { [field]: next },
                    });
                    // The host answers every write with a full payload, so name
                    // where focus belongs once that rebuild lands.
                    lastEditFocus = { id: todo.id, field: field };
                }
                releaseDeferredRender();
                if (refocus) el.focus();
                if (changed) requestAnimationFrame(() => flashSaved(todo.id));
            };

            ta.addEventListener("input", () => autoGrow(ta));
            ta.addEventListener("keydown", (ev) => {
                if (ev.key === "Escape") {
                    // Load-bearing: the global Escape handler runs ahead of its
                    // own text-input guard and would close the task page instead.
                    ev.stopPropagation();
                    finish(false, true);
                    return;
                }
                if (ev.key === "Enter" && (o.enterCommits !== false || ev.metaKey || ev.ctrlKey)) {
                    ev.preventDefault();
                    finish(true, true);
                }
            });
            // Tabbing out already moved focus somewhere deliberate; pulling it
            // back to the read-state div would make the Tab look like a no-op.
            ta.addEventListener("blur", (ev) => finish(true, !ev.relatedTarget));
        }

        // `:scope >` matters: the panel is a direct child of its own card, and a
        // root card's subtree also contains its children's panels.
        function syncExpandPanelField(el, field, value) {
            const card = el.closest(".task-card");
            const ctl = card && card.querySelector(
                ':scope > .task-expand-panel [data-field="' + field + '"]'
            );
            if (ctl) ctl.value = value;
        }

        function buildTaskCard(todo, childrenByParent, depth = 0, parentRepoKey = null) {
            const rk = repoKey(todo.repo);
            // Density tier, capped: sub-tasks read smaller than their parent, but a
            // deep nest stops shrinking rather than becoming unreadable.
            const tier = Math.min(depth, MAX_DEPTH_TIER);
            const card = document.createElement("article");
            card.className = "task-card" + (todo.done ? " done" : "") + (rk ? " repo-" + rk : "");
            if (todo.pinned) card.classList.add("pinned");
            if (expandedId === todo.id) card.classList.add("expanded");
            card.dataset.id = todo.id;
            card.dataset.depth = String(tier);
            card.dataset.group = groupMode === "repo" ? (rk || "unknown") : groupMode === "status" ? statusToneForTodo(todo) : "list";
            card.tabIndex = kbdFocusId === todo.id ? 0 : -1;

            const head = document.createElement("div");
            head.className = "task-card-head";

            const handle = document.createElement("div");
            handle.className = "drag-handle";
            handle.textContent = "⠿";
            handle.title = groupMode === "repo"
                ? "Drag: reorder, nest (center), or drop section header to change repo"
                : groupMode === "status"
                    ? "Drag: reorder, nest (center), or drop section header to change status"
                    : "Drag to reorder; drop on task center to nest";
            handle.setAttribute("role", "button");
            handle.setAttribute("aria-label", "Drag to reorder " + (todo.title || todo.label || "task"));
            handle.classList.remove("hidden");
            handle.addEventListener("mousedown", () => { card.draggable = true; });
            wireDrag(card, handle);

            const checkWrap = document.createElement("label");
            checkWrap.className = "check";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = Boolean(todo.done);
            cb.id = "todo-" + todo.id;
            cb.setAttribute("aria-label", "Mark done: " + (todo.title || todo.label));
            const box = document.createElement("span");
            box.className = "check-box";
            cb.addEventListener("change", () => {
                if (cb.checked) {
                    cb.checked = false;
                    showDoneModal(todo);
                } else {
                    vscode.postMessage({ type: "toggleTodo", id: todo.id, done: false });
                }
            });
            checkWrap.addEventListener("click", (ev) => ev.stopPropagation());
            checkWrap.appendChild(cb);
            checkWrap.appendChild(box);

            const badge = document.createElement("div");
            badge.className = "repo-badge" + (rk ? " repo-" + rk : " repo-unknown");
            // A sub-task almost always sits in its parent's repo. Repeating the
            // badge down the nest only costs the title horizontal room, so it is
            // dropped unless the child actually lives somewhere else.
            if (depth > 0 && rk === parentRepoKey) badge.classList.add("is-redundant");
            if (REPO_VIS[rk]) {
                badge.textContent = REPO_VIS[rk].icon;
                badge.title = REPO_VIS[rk].name;
            } else if (todo.repo) {
                badge.textContent = String(todo.repo).slice(0, 2).toUpperCase();
                badge.title = todo.repo;
            } else {
                badge.textContent = "?";
                badge.title = "No repo";
            }

            const pinBtn = makeCardPinButton(todo);

            // The title is an input now, so it can no longer double as the
            // expand target — this is the explicit disclosure control.
            const isExpanded = expandedId === todo.id;
            const expandBtn = document.createElement("button");
            expandBtn.type = "button";
            expandBtn.className = "card-expand-btn";
            expandBtn.textContent = "⌄";
            expandBtn.title = isExpanded ? "Hide details" : "Show all fields";
            expandBtn.setAttribute(
                "aria-label",
                (isExpanded ? "Hide details for " : "Show details for ")
                + (todo.title || todo.label || "task")
            );
            expandBtn.setAttribute("aria-expanded", isExpanded ? "true" : "false");
            expandBtn.addEventListener("click", (ev) => {
                ev.stopPropagation();
                toggleExpanded(todo.id);
            });

            const body = document.createElement("div");
            body.className = "task-card-body";

            const titleRow = document.createElement("div");
            titleRow.className = "title-row";

            if (!todo.done) {
                const urg = document.createElement("span");
                urg.className = "urgency-dot " + urgencyClassForTodo(todo);
                urg.title = "Priority / status signal";
                titleRow.appendChild(urg);
            }

            const titleEl = editableText(todo, "title", todo.title || todo.label || "", {
                className: "todo-title",
                placeholder: "Untitled",
                emptyLabel: "Untitled",
                label: "task title",
            });
            titleEl.title = (todo.status ? todo.status + " — " : "")
                + "Click to rename · Enter saves, Escape cancels";
            titleRow.appendChild(titleEl);

            if (taskAppliesToWorkspaceContext(todo)) {
                const here = document.createElement("span");
                here.className = "here-pill";
                here.textContent = "Here";
                here.title = "Matches this workspace (repo/branch/worktree)";
                titleRow.appendChild(here);
            }

            const ciDot = !todo.done ? ciDotForTodo(todo) : null;
            if (ciDot) titleRow.appendChild(ciDot);

            const prChip = primaryPrLinkChip(todo);
            if (prChip) titleRow.appendChild(prChip);

            body.appendChild(titleRow);

            // Root cards always offer both fields, empty or not: gating on a value
            // meant clearing one removed the only place to type it back. Nested
            // cards still only show a next action they actually have.
            if (!todo.done && (todo.next_action || tier === 0)) {
                body.appendChild(editableText(todo, "next_action", todo.next_action, {
                    className: "todo-next-action",
                    placeholder: "Next action",
                    emptyLabel: "Add a next action",
                    label: "next action",
                    hint: "Click to edit · Enter saves, Escape cancels",
                }));
            }

            // Notes are the card's body copy. Only root cards carry it: nested
            // sub-tasks stay a title-and-chips row so the hierarchy reads.
            if (tier === 0 && !todo.done) {
                body.appendChild(editableText(todo, "notes", todo.notes, {
                    className: "todo-body",
                    placeholder: "Notes",
                    emptyLabel: "Add notes",
                    label: "notes",
                    enterCommits: false,
                    hint: "Click to edit · ⌘Enter saves, Escape cancels",
                }));
            }

            const secondary = document.createElement("div");
            secondary.className = "meta-row-secondary";
            if (!todo.done) {
                const tone = statusToneForTodo(todo);
                const pill = document.createElement("span");
                pill.className = "status-pill tone-" + tone;
                pill.textContent = statusKeyDisplayLabel(todo);
                pill.title = todo.status || statusKeyDisplayLabel(todo);
                secondary.appendChild(pill);
            }
            const tags = (todo.tags || []).filter(Boolean);
            tags.slice(0, 4).forEach((tag) => {
                secondary.appendChild(createTagChip(tag));
            });
            if (tags.length > 4) {
                const more = chip("tag", "+" + (tags.length - 4));
                styleTagChip(more, tags[4]);
                more.title = tags.slice(4).join(", ");
                secondary.appendChild(more);
            }
            if (secondary.childNodes.length) body.appendChild(secondary);

            const meta = buildMeta(todo);
            if (meta) body.appendChild(meta);

            head.appendChild(handle);
            const lead = document.createElement("div");
            lead.className = "card-lead";
            lead.appendChild(checkWrap);
            lead.appendChild(expandBtn);
            head.appendChild(lead);
            head.appendChild(badge);
            head.appendChild(pinBtn);
            if (!todo.done && depth < 2) {
                head.appendChild(makeCardDoneButton(todo));
            }
            head.appendChild(body);
            card.appendChild(head);

            if (expandedId === todo.id) {
                card.appendChild(buildExpandPanel(todo));
            }

            if (childrenByParent) {
                const kids = childrenByParent.get(todo.id);
                if (kids && kids.length) {
                    const nestToggle = document.createElement("button");
                    nestToggle.type = "button";
                    nestToggle.className = "nest-toggle";
                    const collapsed = isNestCollapsed(todo.id);
                    nestToggle.textContent = "▾";
                    nestToggle.title = collapsed
                        ? "Show " + kids.length + " nested"
                        : "Hide nested";
                    nestToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
                    nestToggle.setAttribute(
                        "aria-label",
                        (collapsed ? "Expand" : "Collapse") +
                            " " + kids.length + " nested tasks"
                    );
                    nestToggle.addEventListener("click", (ev) => {
                        ev.stopPropagation();
                        toggleNestCollapsed(todo.id);
                    });
                    lead.appendChild(nestToggle);
                    if (!collapsed) {
                        const nest = document.createElement("div");
                        nest.className = "task-nest";
                        kids.forEach((child) => {
                            nest.appendChild(buildTaskCard(child, childrenByParent, depth + 1, rk));
                        });
                        card.appendChild(nest);
                    }
                }
            }

            card.addEventListener("click", (ev) => {
                if (ev.target.closest("a, button, input, textarea, select, label.check, .drag-handle, .task-expand-panel, .card-pin-btn, .card-done-btn, .nest-toggle")) {
                    return;
                }
                toggleExpanded(todo.id);
            });
            if (kbdFocusId === todo.id) {
                card.classList.add("kbd-focus");
            }
            return card;
        }

        function visibleTaskCards() {
            return [...document.querySelectorAll("#sectionsRoot .task-card, #sectionsRoot .board-card")];
        }

        function cardElementById(id) {
            const esc = CSS.escape(id);
            return document.querySelector(
                '.task-card[data-id="' + esc + '"], .board-card[data-id="' + esc + '"]'
            );
        }

        function setKbdFocus(id) {
            if (kbdFocusId === id) {
                return;
            }
            kbdFocusId = id;
            document.querySelectorAll(".kbd-focus").forEach((el) => {
                el.classList.remove("kbd-focus");
            });
            if (!id) return;
            const card = cardElementById(id);
            if (card) {
                card.classList.add("kbd-focus");
            }
            saveUiState({ kbdFocusId: id });
        }

        function cardTodoById(id) {
            return (boot.activeTasks.todos || []).find((t) => t.id === id);
        }

        function triggerDoneForTodo(todo) {
            if (!todo || todo.done) return;
            showDoneModal(todo);
        }

        function isNestCollapsed(parentId) {
            return collapsedNestIds.has(parentId);
        }

        function toggleNestCollapsed(parentId) {
            if (collapsedNestIds.has(parentId)) {
                collapsedNestIds.delete(parentId);
            } else {
                collapsedNestIds.add(parentId);
            }
            saveUiState();
            scheduleRender();
        }

        function makeCardDoneButton(todo, className) {
            const doneBtn = document.createElement("button");
            doneBtn.type = "button";
            doneBtn.className = className || "card-done-btn";
            doneBtn.textContent = "✓";
            doneBtn.title = "Mark done";
            doneBtn.setAttribute(
                "aria-label",
                "Mark done: " + (todo.title || todo.label || "task")
            );
            doneBtn.addEventListener("click", (ev) => {
                ev.stopPropagation();
                showDoneModal(todo);
            });
            return doneBtn;
        }

        function makeCardPinButton(todo, className) {
            const pinBtn = document.createElement("button");
            pinBtn.type = "button";
            pinBtn.className = "card-pin-btn" +
                (className ? " " + className : "") +
                (todo.pinned ? " is-pinned" : "");
            pinBtn.textContent = "📌";
            pinBtn.title = todo.pinned ? "Unpin (move to Open)" : "Pin to top";
            pinBtn.setAttribute(
                "aria-label",
                todo.pinned ? "Unpin task" : "Pin task to top"
            );
            pinBtn.setAttribute("aria-pressed", todo.pinned ? "true" : "false");
            pinBtn.addEventListener("click", (ev) => {
                ev.stopPropagation();
                vscode.postMessage({
                    type: "setPinned",
                    id: todo.id,
                    pinned: !todo.pinned,
                });
            });
            return pinBtn;
        }


        function indexChildrenByParent(todos) {
            const map = new Map();
            const order = new Map(todos.map((t, i) => [t.id, i]));
            todos.forEach((t) => {
                const p = (t.parent_id || "").trim();
                if (!p) return;
                if (!map.has(p)) map.set(p, []);
                map.get(p).push(t);
            });
            for (const arr of map.values()) {
                arr.sort((a, b) => (order.get(a.id) ?? 0) - (order.get(b.id) ?? 0));
            }
            return map;
        }

        function rootTodosInSection(todos) {
            const ids = new Set(todos.map((t) => t.id));
            return todos.filter((t) => {
                const p = (t.parent_id || "").trim();
                return !p || !ids.has(p);
            });
        }

        function parentMapFromTodos(todos) {
            const map = new Map();
            todos.forEach((t) => {
                map.set(t.id, (t.parent_id || "").trim() || null);
            });
            return map;
        }

        function isUnderAncestor(nodeId, ancestorId, parentMap) {
            let cur = parentMap.get(nodeId) || null;
            while (cur) {
                if (cur === ancestorId) return true;
                cur = parentMap.get(cur) || null;
            }
            return false;
        }

        function insertAfterSubtree(orderIds, parentId, childId, parentMap) {
            const without = orderIds.filter((id) => id !== childId);
            const idx = without.indexOf(parentId);
            if (idx < 0) {
                without.push(childId);
                return without;
            }
            let end = idx + 1;
            while (end < without.length && isUnderAncestor(without[end], parentId, parentMap)) {
                end += 1;
            }
            without.splice(end, 0, childId);
            return without;
        }

        function dragDropZone(card, clientY) {
            const rect = card.getBoundingClientRect();
            const y = (clientY - rect.top) / rect.height;
            if (y < 0.25) return "before";
            if (y > 0.75) return "after";
            return "nest";
        }

        function groupSyncForSectionKey(groupKey) {
            if (groupMode === "list" || !groupKey) return undefined;
            if (groupMode === "repo") {
                if (groupKey === "unknown") return { repo: null };
                if (REPO_VIS[groupKey]) return { repo: groupKey };
                return undefined;
            }
            if (groupMode === "status") {
                return statusGroupSync(groupKey);
            }
            return undefined;
        }

        function statusGroupSync(tone) {
            // Archive tones are terminal — never emit them as open status_keys.
            if (!tone || isDoneTone(tone)) return undefined;
            const bucket = STATUS_BUCKETS.find((b) => b.tone === tone);
            return {
                status: bucket ? bucket.label : "Backlog",
                status_key: statusKeyForTone(tone),
            };
        }

        function groupSyncForTargetCard(targetTodo, cardGroupKey, forceStatus) {
            if (forceStatus) return statusGroupSync(cardGroupKey);
            return groupSyncForSectionKey(cardGroupKey);
        }

        function applyGroupSyncToTodo(todo, sync) {
            if (!sync || !todo) return;
            if ("repo" in sync) todo.repo = sync.repo;
            if (sync.status !== undefined) todo.status = sync.status;
            if (sync.status_key !== undefined) todo.status_key = sync.status_key;
        }

        function todosMatchingSection(groupKey) {
            const todos = (boot.activeTasks.todos || []).filter((t) => !t.done);
            if (groupMode === "repo") {
                return todos.filter((t) => (repoKey(t.repo) || "unknown") === groupKey);
            }
            if (groupMode === "status") {
                return todos.filter((t) => statusToneForTodo(t) === groupKey);
            }
            return todos;
        }

        function wireSectionDrop(sectionEl, sectionGroupKey) {
            if (groupMode === "list" || !sectionGroupKey) return;
            const head = sectionEl.querySelector(".section-head");
            if (!head) return;
            head.addEventListener("dragover", (ev) => {
                if (!draggedId) return;
                ev.preventDefault();
                ev.dataTransfer.dropEffect = "move";
                sectionEl.classList.add("section-drop-target");
            });
            head.addEventListener("dragleave", (ev) => {
                if (ev.relatedTarget && head.contains(ev.relatedTarget)) return;
                sectionEl.classList.remove("section-drop-target");
            });
            head.addEventListener("drop", (ev) => {
                if (!draggedId) return;
                ev.preventDefault();
                sectionEl.classList.remove("section-drop-target");
                applyDropOnSection(draggedId, sectionGroupKey);
                clearIndicators();
            });
        }

        function applyDropOnSection(dragId, sectionGroupKey) {
            const sync = groupSyncForSectionKey(sectionGroupKey);
            if (!sync) return;
            const inSection = todosMatchingSection(sectionGroupKey).filter((t) => t.id !== dragId);
            if (inSection.length) {
                const last = inSection[inSection.length - 1];
                applyMoveSibling(dragId, last.id, true, sync);
                return;
            }
            const todos = boot.activeTasks.todos || [];
            const byId = new Map(todos.map((t) => [t.id, { ...t }]));
            const drag = byId.get(dragId);
            if (!drag) return;
            drag.parent_id = null;
            applyGroupSyncToTodo(drag, sync);
            const openIds = todos.filter((t) => !t.done).map((t) => t.id);
            const without = openIds.filter((id) => id !== dragId);
            without.push(dragId);
            boot.activeTasks.todos = without.map((id) => byId.get(id)).filter(Boolean);
            vscode.postMessage({ type: "moveTaskToSection", childId: dragId, groupSync: sync });
            scheduleRender();
        }

        function wireDrag(card, handle) {
            card.addEventListener("dragstart", (ev) => {
                draggedId = card.dataset.id;
                card.classList.add("dragging");
                ev.dataTransfer.effectAllowed = "move";
                try { ev.dataTransfer.setData("text/plain", draggedId); } catch (e) { /* noop */ }
            });
            card.addEventListener("dragend", () => {
                draggedId = null;
                card.draggable = false;
                card.classList.remove("dragging");
                clearIndicators();
            });
            card.addEventListener("dragover", (ev) => {
                if (!draggedId || card.dataset.id === draggedId) return;
                ev.preventDefault();
                ev.dataTransfer.dropEffect = "move";
                const zone = dragDropZone(card, ev.clientY);
                clearIndicators();
                if (zone === "nest") {
                    card.classList.add("drop-nest");
                } else {
                    card.classList.add(zone === "after" ? "drop-after" : "drop-before");
                }
            });
            card.addEventListener("dragleave", () => {
                card.classList.remove("drop-before", "drop-after", "drop-nest");
            });
            card.addEventListener("drop", (ev) => {
                if (!draggedId || card.dataset.id === draggedId) return;
                ev.preventDefault();
                const zone = dragDropZone(card, ev.clientY);
                if (zone === "nest") {
                    applyNest(draggedId, card.dataset.id, card.dataset.group);
                } else {
                    applyMoveSibling(draggedId, card.dataset.id, zone === "after", groupSyncForTargetCard(cardTodoById(card.dataset.id), card.dataset.group));
                }
                clearIndicators();
            });
        }

        function clearIndicators() {
            document.querySelectorAll(
                ".task-card.drop-before, .task-card.drop-after, .task-card.drop-nest, " +
                ".board-card.drop-before, .board-card.drop-after, .board-card.drop-nest"
            )
                .forEach((el) => el.classList.remove("drop-before", "drop-after", "drop-nest"));
        }

        function applyNest(childId, parentId, parentCardGroup, forceStatus) {
            const todos = boot.activeTasks.todos || [];
            const parentMap = parentMapFromTodos(todos);
            if (isUnderAncestor(parentId, childId, parentMap)) return;
            const byId = new Map(todos.map((t) => [t.id, { ...t }]));
            const child = byId.get(childId);
            const parent = byId.get(parentId);
            if (!child || !parent) return;
            const sync = groupSyncForTargetCard(parent, parentCardGroup, forceStatus);
            child.parent_id = parentId;
            applyGroupSyncToTodo(child, sync);
            parentMap.set(childId, parentId);
            const openIds = todos.filter((t) => !t.done).map((t) => t.id);
            const order = insertAfterSubtree(openIds, parentId, childId, parentMap);
            boot.activeTasks.todos = order.map((id) => byId.get(id)).filter(Boolean);
            const msg = { type: "nestTask", childId, parentId };
            if (sync) msg.groupSync = sync;
            vscode.postMessage(msg);
            scheduleRender();
        }

        function applyMoveSibling(dragId, targetId, after, sync) {
            const todos = boot.activeTasks.todos || [];
            const byId = new Map(todos.map((t) => [t.id, { ...t }]));
            const target = byId.get(targetId);
            const drag = byId.get(dragId);
            if (!target || !drag) return;
            const newParent = (target.parent_id || "").trim() || null;
            drag.parent_id = newParent;
            applyGroupSyncToTodo(drag, sync);
            const parentMap = parentMapFromTodos([...byId.values()]);
            if (newParent && isUnderAncestor(newParent, dragId, parentMap)) return;
            const openIds = todos.filter((t) => !t.done).map((t) => t.id);
            const without = openIds.filter((id) => id !== dragId);
            let idx = without.indexOf(targetId);
            if (idx < 0) {
                without.push(dragId);
            } else {
                if (after) idx += 1;
                without.splice(idx, 0, dragId);
            }
            boot.activeTasks.todos = without.map((id) => byId.get(id)).filter(Boolean);
            const msg = { type: "moveTaskSibling", childId: dragId, targetId, after };
            if (sync) msg.groupSync = sync;
            vscode.postMessage(msg);
            scheduleRender();
        }

        function sectionHead(title, count, dotColor) {
            const head = document.createElement("div");
            head.className = "section-head";
            if (dotColor) {
                const dot = document.createElement("span");
                dot.className = "sh-dot";
                dot.style.background = dotColor;
                head.appendChild(dot);
            }
            const h2 = document.createElement("h2");
            h2.textContent = title;
            const c = document.createElement("span");
            c.className = "section-count";
            c.textContent = String(count);
            head.appendChild(h2);
            head.appendChild(c);
            return head;
        }

        function listSection(title, todos, dotColor, sectionGroupKey) {
            const wrap = document.createElement("section");
            wrap.className = "section";
            if (sectionGroupKey) {
                wrap.dataset.sectionGroup = sectionGroupKey;
            }
            wrap.appendChild(sectionHead(title, todos.length, dotColor));
            const list = document.createElement("div");
            list.className = "task-cards";
            if (hideNested) {
                const roots = rootTodosInSection(todos);
                const order = new Map(todos.map((t, i) => [t.id, i]));
                roots.sort((a, b) => (order.get(a.id) ?? 0) - (order.get(b.id) ?? 0));
                roots.forEach((t) => list.appendChild(buildTaskCard(t, null)));
            } else {
                const childrenByParent = indexChildrenByParent(todos);
                const roots = rootTodosInSection(todos);
                const order = new Map(todos.map((t, i) => [t.id, i]));
                roots.sort((a, b) => (order.get(a.id) ?? 0) - (order.get(b.id) ?? 0));
                roots.forEach((t) => list.appendChild(buildTaskCard(t, childrenByParent)));
            }
            wrap.appendChild(list);
            wireSectionDrop(wrap, sectionGroupKey);
            return wrap;
        }

        function groupByRepo(root, todos) {
            const seen = new Set();
            REPO_ORDER.forEach((key) => {
                const items = todos.filter((t) => repoKey(t.repo) === key);
                items.forEach((t) => seen.add(t.id));
                if (items.length) {
                    root.appendChild(listSection(REPO_VIS[key].name, items, REPO_VIS[key].accent, key));
                }
            });
            const rest = todos.filter((t) => !seen.has(t.id));
            if (rest.length) root.appendChild(listSection("Other", rest, "var(--muted)", "unknown"));
        }

        function groupByStatus(root, todos) {
            STATUS_BUCKETS.forEach((bucket) => {
                const items = todos.filter((t) => statusToneForTodo(t) === bucket.tone);
                if (items.length) {
                    root.appendChild(
                        listSection(bucket.label, items, STATUS_TONE_DOT[bucket.tone], bucket.tone)
                    );
                }
            });
        }

        const BOARD_COL_DOT = STATUS_TONE_DOT;

        function statusKeyForTone(tone) {
            if (isDoneTone(tone)) {
                return "backlog";
            }
            if (tone === "default" || tone === "ready" || tone === "paused" || tone === "other") {
                return "backlog";
            }
            return tone;
        }

        function buildBoardCard(todo, childrenByParent, depth) {
            const tier = Math.min(depth || 0, 2);
            const card = document.createElement("article");
            card.className = "board-card";
            if (expandedId === todo.id) card.classList.add("is-expanded");
            if (kbdFocusId === todo.id) card.classList.add("kbd-focus");
            card.dataset.id = todo.id;
            card.dataset.depth = String(tier);
            card.dataset.group = statusToneForTodo(todo);
            card.draggable = true;
            card.tabIndex = kbdFocusId === todo.id ? 0 : -1;

            const title = document.createElement("div");
            title.className = "board-card-title";
            const urg = document.createElement("span");
            urg.className = "urgency-dot " + urgencyClassForTodo(todo);
            urg.title = "Priority / status signal";
            title.appendChild(urg);
            const titleText = editableText(todo, "title", todo.title || todo.label || "", {
                className: "board-card-title-text",
                placeholder: "Untitled",
                emptyLabel: "Untitled",
                label: "task title",
            });
            title.appendChild(titleText);
            card.appendChild(title);

            card.appendChild(editableText(todo, "next_action", todo.next_action, {
                className: "board-card-next",
                placeholder: "Next action",
                emptyLabel: "Add a next action",
                label: "next action",
            }));

            const foot = document.createElement("div");
            foot.className = "board-card-foot";
            const p = typeof todo.priority === "number" ? todo.priority : 1;
            const prio = document.createElement("span");
            prio.className = "board-prio p" + p;
            prio.textContent = "P" + p;
            prio.title = "Priority " + p + " (0 = highest)";
            foot.appendChild(prio);
            if (todo.pinned) {
                const pin = document.createElement("span");
                pin.className = "pin-indicator";
                pin.textContent = "📌";
                pin.title = "Pinned";
                foot.appendChild(pin);
            }
            const rk = repoKey(todo.repo);
            if (REPO_VIS[rk]) {
                const repoChip = chip("repo repo-" + rk, REPO_VIS[rk].short);
                repoChip.title = REPO_VIS[rk].name;
                foot.appendChild(repoChip);
            }
            const prChip = primaryPrLinkChip(todo);
            if (prChip) foot.appendChild(prChip);
            const ciDot = ciDotForTodo(todo);
            if (ciDot) foot.appendChild(ciDot);
            foot.appendChild(makeCardPinButton(todo, "board-card-pin-btn"));
            foot.appendChild(makeCardDoneButton(todo, "board-card-done-btn"));
            card.appendChild(foot);

            wireBoardCardDrag(card);
            card.addEventListener("click", (ev) => {
                if (ev.target.closest("a, button, input, textarea, select, .editable")) return;
                setKbdFocus(todo.id);
                toggleExpanded(todo.id);
            });
            card.addEventListener("keydown", (ev) => {
                if (ev.key === "Enter") {
                    ev.preventDefault();
                    toggleExpanded(todo.id);
                }
            });

            if (childrenByParent) {
                const kids = childrenByParent.get(todo.id);
                if (kids && kids.length) {
                    const nestToggle = document.createElement("button");
                    nestToggle.type = "button";
                    nestToggle.className = "nest-toggle";
                    const collapsed = isNestCollapsed(todo.id);
                    nestToggle.textContent = "▾";
                    nestToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
                    nestToggle.title = collapsed
                        ? "Show " + kids.length + " nested"
                        : "Hide nested";
                    nestToggle.addEventListener("click", (ev) => {
                        ev.stopPropagation();
                        toggleNestCollapsed(todo.id);
                    });
                    foot.appendChild(nestToggle);
                    if (!collapsed) {
                        const nest = document.createElement("div");
                        nest.className = "board-nest";
                        kids.forEach((child) => {
                            nest.appendChild(buildBoardCard(child, childrenByParent, tier + 1));
                        });
                        card.appendChild(nest);
                    }
                }
            }
            return card;
        }

        function wireBoardCardDrag(card) {
            card.addEventListener("dragstart", (ev) => {
                draggedId = card.dataset.id;
                card.classList.add("dragging");
                ev.dataTransfer.effectAllowed = "move";
                try { ev.dataTransfer.setData("text/plain", draggedId); } catch (e) { /* noop */ }
            });
            card.addEventListener("dragend", () => {
                draggedId = null;
                card.classList.remove("dragging");
                clearBoardDropTargets();
                clearIndicators();
            });
            card.addEventListener("dragover", (ev) => {
                if (!draggedId || card.dataset.id === draggedId) return;
                ev.preventDefault();
                ev.stopPropagation();
                ev.dataTransfer.dropEffect = "move";
                const zone = dragDropZone(card, ev.clientY);
                clearIndicators();
                card.classList.add(
                    zone === "nest" ? "drop-nest" : zone === "after" ? "drop-after" : "drop-before"
                );
            });
            card.addEventListener("dragleave", (ev) => {
                if (ev.relatedTarget && card.contains(ev.relatedTarget)) return;
                card.classList.remove("drop-before", "drop-after", "drop-nest");
            });
            card.addEventListener("drop", (ev) => {
                if (!draggedId || card.dataset.id === draggedId) return;
                ev.preventDefault();
                ev.stopPropagation();
                const zone = dragDropZone(card, ev.clientY);
                if (zone === "nest") {
                    applyNest(draggedId, card.dataset.id, card.dataset.group, true);
                } else {
                    applyMoveSibling(
                        draggedId,
                        card.dataset.id,
                        zone === "after",
                        statusGroupSync(card.dataset.group)
                    );
                }
                clearIndicators();
            });
        }

        function clearBoardDropTargets() {
            document.querySelectorAll(".board-col.drop-target")
                .forEach((el) => el.classList.remove("drop-target"));
        }

        function wireBoardColumnDrop(col, tone) {
            col.addEventListener("dragover", (ev) => {
                if (!draggedId) return;
                ev.preventDefault();
                ev.dataTransfer.dropEffect = "move";
                col.classList.add("drop-target");
            });
            col.addEventListener("dragleave", (ev) => {
